plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mytranscriber.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mytranscriber.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "androidx.media3:media3-transformer:1.8.1"
    implementation "androidx.media3:media3-effect:1.8.1"
    implementation "androidx.media3:media3-common:1.8.1"

    implementation 'com.unity3d.ads:unity-ads:4.20.0'
}
