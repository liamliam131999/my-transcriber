<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Transcriber</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #101114;
    color: #ffffff;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 18px;
}

/* Header */
.header {
    text-align: center;
    padding: 15px 10px 25px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
}

.header p {
    margin-top: 8px;
    color: #a9abb3;
    font-size: 14px;
}

/* GRID UI */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.card {
    min-height: 145px;
    background: #191b20;
    border: 1px solid #2c2f36;
    border-radius: 18px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    transition: 0.15s;
}

.card:active {
    transform: scale(0.96);
    background: #22252b;
}

.card-icon {
    font-size: 38px;
    margin-bottom: 12px;
}

.card-title {
    font-size: 17px;
    font-weight: bold;
}

.card-description {
    font-size: 12px;
    color: #999da7;
    margin-top: 6px;
}

/* Sections */
.section {
    display: none;
}

.section.active {
    display: block;
}

.back-button {
    width: 100%;
    padding: 13px;
    margin-bottom: 18px;
    border: none;
    border-radius: 12px;
    background: #25282f;
    color: white;
    font-size: 15px;
}

/* Inputs */
label {
    display: block;
    margin-top: 14px;
    margin-bottom: 7px;
    color: #c9cbd1;
    font-size: 14px;
}

input[type="text"],
input[type="password"],
input[type="file"],
select {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #353841;
    background: #181a1f;
    color: white;
}

/* Buttons */
button.action {
    width: 100%;
    padding: 14px;
    margin-top: 14px;
    border: none;
    border-radius: 12px;
    background: #30343c;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

button.action:active {
    transform: scale(0.98);
}

/* Result */
.result {
    margin-top: 15px;
    padding: 15px;
    background: #181a1f;
    border: 1px solid #30333a;
    border-radius: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
}

/* Progress */
.progress {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: #202329;
    color: #c9cbd1;
    display: none;
}

/* Download */
.download-button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    background: #30343c;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

/* Mobile */
@media (max-width: 380px) {

    .grid {
        gap: 10px;
    }

    .card {
        min-height: 130px;
        padding: 15px;
    }

    .card-icon {
        font-size: 32px;
    }

    .card-title {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HOME -->
    <div id="homeSection" class="section active">

        <div class="header">
            <h1>My Transcriber</h1>
            <p>Audio & Video Transcription Tools</p>
        </div>

        <div class="grid">

            <div class="card" onclick="showSection('groqSection')">
                <div class="card-icon">🎙️</div>
                <div class="card-title">Groq Whisper</div>
                <div class="card-description">
                    Fast transcription
                </div>
            </div>

            <div class="card" onclick="showSection('geminiSection')">
                <div class="card-icon">✨</div>
                <div class="card-title">Gemini</div>
                <div class="card-description">
                    AI transcription
                </div>
            </div>

            <div class="card" onclick="showSection('compressorSection')">
                <div class="card-icon">🗜️</div>
                <div class="card-title">Compressor</div>
                <div class="card-description">
                    Compress audio
                </div>
            </div>

            <div class="card" onclick="openTelegram()">
                <div class="card-icon">✈️</div>
                <div class="card-title">ဆက်သွယ်ရန်</div>
                <div class="card-description">
                    Telegram
                </div>
            </div>

        </div>

    </div>


    <!-- GROQ -->
    <div id="groqSection" class="section">

        <button class="back-button"
                onclick="showSection('homeSection')">
            ← Back
        </button>

        <h2>🎙️ Groq Whisper</h2>

        <label>Groq API Key</label>

        <input
            type="password"
            id="groqApiKey"
            placeholder="Enter Groq API Key">

        <label>Audio / Video File</label>

        <input
            type="file"
            id="groqFile"
            accept="audio/*,video/*">

        <button
            class="action"
            onclick="transcribeGroq(true)">
            🕒 Timestamp
        </button>

        <button
            class="action"
            onclick="transcribeGroq(false)">
            💬 Dialogue
        </button>

        <div id="groqResult"
             class="result"
             style="display:none;"></div>

    </div>


    <!-- GEMINI -->
    <div id="geminiSection" class="section">

        <button class="back-button"
                onclick="showSection('homeSection')">
            ← Back
        </button>

        <h2>✨ Gemini</h2>

        <label>Gemini API Key</label>

        <input
            type="password"
            id="geminiApiKey"
            placeholder="Enter Gemini API Key">

        <label>Audio / Video File</label>

        <input
            type="file"
            id="geminiFile"
            accept="audio/*,video/*">

        <button
            class="action"
            onclick="transcribeGemini(true)">
            🕒 Timestamp
        </button>

        <button
            class="action"
            onclick="transcribeGemini(false)">
            💬 Dialogue
        </button>

        <div id="geminiResult"
             class="result"
             style="display:none;"></div>

    </div>


    <!-- COMPRESSOR -->
    <div id="compressorSection" class="section">

        <button class="back-button"
                onclick="showSection('homeSection')">
            ← Back
        </button>

        <h2>🗜️ Audio Compressor</h2>

        <p style="color:#999da7;font-size:14px;">
            Video input will be converted to audio only.
        </p>

        <button
            class="action"
            onclick="selectCompressorFile()">
            📁 Select Audio / Video
        </button>

        <div id="compressFileName"
             class="result"
             style="display:none;">
        </div>

        <label>Bitrate</label>

        <select id="compressBitrate">
            <option value="48">48 kbps</option>
            <option value="64">64 kbps</option>
            <option value="96">96 kbps</option>
            <option value="128">128 kbps</option>
        </select>

        <button
            class="action"
            onclick="compressAudio()">
            🗜️ Compress Audio
        </button>

        <div id="compressProgress"
             class="progress">
        </div>

        <div id="compressResult"
             class="result"
             style="display:none;">
        </div>

        <div id="downloadArea"></div>

    </div>

</div>


<script>

/* =========================
   NAVIGATION
========================= */

function showSection(id) {

    document
        .querySelectorAll(".section")
        .forEach(function(section) {
            section.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");

    window.scrollTo(0, 0);
}


/* =========================
   TELEGRAM
========================= */

function openTelegram() {

    if (window.AndroidBridge &&
        window.AndroidBridge.openTelegram) {

        AndroidBridge.openTelegram();

    } else {

        window.open(
            "https://t.me/liamliam131999",
            "_blank"
        );
    }
}


/* =========================
   GROQ
========================= */

async function transcribeGroq(timestampMode) {

    const apiKey =
        document.getElementById("groqApiKey").value.trim();

    const fileInput =
        document.getElementById("groqFile");

    const result =
        document.getElementById("groqResult");

    if (!apiKey) {
        alert("Groq API Key ထည့်ပါ။");
        return;
    }

    if (!fileInput.files.length) {
        alert("Audio / Video file ရွေးပါ။");
        return;
    }

    const file = fileInput.files[0];

    if (file.size > 25 * 1024 * 1024) {
        alert("File size သည် 25MB ထက် မကျော်ရပါ။");
        return;
    }

    result.style.display = "block";
    result.innerHTML = "Transcribing...";

    try {

        const formData = new FormData();

        formData.append("file", file);
        formData.append(
            "model",
            "whisper-large-v3"
        );
        formData.append(
            "response_format",
            "verbose_json"
        );

        const response = await fetch(
            "https://api.groq.com/openai/v1/audio/transcriptions",
            {
                method: "POST",
                headers: {
                    "Authorization":
                        "Bearer " + apiKey
                },
                body: formData
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message ||
                "Groq API Error"
            );
        }

        let output = "";

        if (timestampMode && data.segments) {

            data.segments.forEach(function(segment) {

                const seconds =
                    Math.floor(segment.start || 0);

                const minutes =
                    Math.floor(seconds / 60);

                const secs =
                    seconds % 60;

                const time =
                    "[" +
                    String(minutes).padStart(2, "0") +
                    ":" +
                    String(secs).padStart(2, "0") +
                    "]";

                output +=
                    time +
                    " " +
                    segment.text.trim() +
                    "\n";
            });

        } else {

            output =
                data.text || "";
        }

        showResult(
            result,
            output
        );

    } catch (error) {

        result.innerHTML =
            escapeHtml(
                error.message || "Unknown error"
            );
    }
}


/* =========================
   GEMINI
========================= */

async function transcribeGemini(timestampMode) {

    const apiKey =
        document.getElementById("geminiApiKey")
            .value.trim();

    const fileInput =
        document.getElementById("geminiFile");

    const result =
        document.getElementById("geminiResult");

    if (!apiKey) {
        alert("Gemini API Key ထည့်ပါ။");
        return;
    }

    if (!fileInput.files.length) {
        alert("Audio / Video file ရွေးပါ။");
        return;
    }

    const file =
        fileInput.files[0];

    result.style.display = "block";
    result.innerHTML = "Transcribing...";

    try {

        const base64 =
            await fileToBase64(file);

        const prompt =
            timestampMode
                ? "Transcribe this audio accurately with timestamps in [mm:ss] format."
                : "Transcribe this audio accurately as dialogue.";

        const response =
            await fetch(
                "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" +
                encodeURIComponent(apiKey),
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        contents: [
                            {
                                parts: [
                                    {
                                        text: prompt
                                    },
                                    {
                                        inline_data: {
                                            mime_type:
                                                file.type,
                                            data:
                                                base64
                                        }
                                    }
                                ]
                            }
                        ]
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message ||
                "Gemini API Error"
            );
        }

        const text =
            data.candidates?.[0]
                ?.content?.parts?.[0]
                ?.text || "";

        showResult(
            result,
            text
        );

    } catch (error) {

        result.innerHTML =
            escapeHtml(
                error.message ||
                "Unknown error"
            );
    }
}


/* =========================
   FILE TO BASE64
========================= */

function fileToBase64(file) {

    return new Promise(function(resolve, reject) {

        const reader =
            new FileReader();

        reader.onload = function() {

            const result =
                reader.result;

            const base64 =
                result.split(",")[1];

            resolve(base64);
        };

        reader.onerror = reject;

        reader.readAsDataURL(file);
    });
}


/* =========================
   RESULT
========================= */

function showResult(element, text) {

    element.style.display = "block";

    element.innerHTML =
        escapeHtml(text)
            .replace(/\n/g, "<br>");
}


function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   COMPRESSOR
========================= */

function selectCompressorFile() {

    if (window.AndroidBridge &&
        AndroidBridge.selectCompressorFile) {

        AndroidBridge.selectCompressorFile();

    } else {

        showCompressResult(
            false,
            "Android file picker မရရှိပါ။",
            0,
            0
        );
    }
}


window.onNativeFileSelected =
    function(name, size) {

        const box =
            document.getElementById(
                "compressFileName"
            );

        box.style.display = "block";

        box.innerHTML =
            "📁 " +
            escapeHtml(name) +
            "<br><br>" +
            "Size: " +
            formatSize(size);
    };


function compressAudio() {

    const bitrate =
        parseInt(
            document.getElementById(
                "compressBitrate"
            ).value
        );

    if (window.AndroidBridge &&
        AndroidBridge.compressAudio) {

        const progress =
            document.getElementById(
                "compressProgress"
            );

        progress.style.display = "block";

        progress.innerText =
            "Audio ကို ချုံ့နေပါတယ်...";

        AndroidBridge.compressAudio(
            bitrate
        );

    } else {

        showCompressResult(
            false,
            "Android compressor မရရှိပါ။",
            0,
            0
        );
    }
}


/* =========================
   COMPRESSION PROGRESS
========================= */

window.onCompressionProgress =
    function(message) {

        const progress =
            document.getElementById(
                "compressProgress"
            );

        progress.style.display = "block";

        progress.innerText =
            message;
    };


/* =========================
   COMPRESSION FINISHED
========================= */

window.onCompressionFinished =
    function(
        success,
        message,
        originalSize,
        compressedSize,
        outputPath
    ) {

        const progress =
            document.getElementById(
                "compressProgress"
            );

        progress.style.display =
            "none";

        showCompressResult(
            success,
            message,
            originalSize,
            compressedSize
        );

        const downloadArea =
            document.getElementById(
                "downloadArea"
            );

        downloadArea.innerHTML = "";

        if (success &&
            outputPath) {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "download-button";

            button.innerText =
                "⬇️ Download Audio";

            button.onclick =
                function() {

                    downloadCompressedFile(
                        outputPath
                    );
                };

            downloadArea.appendChild(
                button
            );
        }
    };


/* =========================
   DOWNLOAD
========================= */

function downloadCompressedFile(
    outputPath
) {

    if (window.AndroidBridge &&
        AndroidBridge.downloadCompressedFile) {

        AndroidBridge.downloadCompressedFile(
            outputPath
        );

    } else {

        showDownloadFinished(
            false,
            "Download function မရရှိပါ။"
        );
    }
}


window.onDownloadFinished =
    function(success, message) {

        if (success) {

            alert(
                "✅ " + message
            );

        } else {

            alert(
                "❌ " + message
            );
        }
    };


/* =========================
   COMPRESS RESULT
========================= */

function showCompressResult(
    success,
    message,
    originalSize,
    compressedSize
) {

    const result =
        document.getElementById(
            "compressResult"
        );

    result.style.display = "block";

    result.innerHTML =
        (success ? "✅ " : "❌ ") +
        escapeHtml(message);
}


/* =========================
   SIZE FORMAT
========================= */

function formatSize(bytes) {

    if (!bytes || bytes <= 0) {
        return "0 MB";
    }

    const mb =
        bytes / 1024 / 1024;

    if (mb < 1) {

        const kb =
            bytes / 1024;

        return kb.toFixed(1) +
            " KB";
    }

    return mb.toFixed(2) +
        " MB";
}

</script>

</body>
</html>
