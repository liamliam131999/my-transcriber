<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Transcriber</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: #58a6ff;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        .tabs {
            display: flex;
            justify-content: space-around;
            background-color: #21262d;
            padding: 10px;
            border-radius: 6px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #c9d1d9;
            cursor: pointer;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 4px;
        }
        .tab-btn.active {
            background-color: #238636;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-primary {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .result-box {
            margin-top: 15px;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>My Transcriber</h2>
    
    <!-- Tab Navigation -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('downloader')">Downloader</button>
        <button class="tab-btn" onclick="switchTab('compressor')">Compressor</button>
    </div>

    <!-- 1. DOWNLOADER TAB -->
    <div id="downloader" class="tab-content card active">
        <h3>YouTube Video Downloader</h3>
        <label>ဗီဒီယို လင့်ခ် (URL) ထည့်ရန်</label>
        <input type="text" id="videoUrl" placeholder="https://youtube.com/...">
        <button class="btn-primary" onclick="processDownload()">လင့်ခ်ရယူရန် (Download Link ဖန်တီးမည်)</button>
        <div id="downloadResult" class="result-box" style="display:none;"></div>
    </div>

    <!-- 2. COMPRESSOR TAB -->
    <div id="compressor" class="tab-content card">
        <h3>Audio / Video Compressor (< 25MB)</h3>
        <label>ဖိုင်ရွေးချယ်ပါ (အသံဖိုင် သို့မဟုတ် ဗီဒီယို)</label>
        <input type="file" id="compressFile" accept="audio/*,video/*">
        <button class="btn-primary" onclick="compressFileAction()">ဖိုင်ဆိုဒ် ချုံးမည် (Compress)</button>
        <div id="compressResult" class="result-box" style="display:none;"></div>
    </div>
</div>

<script>
    // Tab Switching Logic
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // Downloader Logic
    const BACKEND_URL = "https://my-transcriber-production-0f34.up.railway.app/download";

    async function processDownload() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        const resultDiv = document.getElementById('downloadResult');

        if (!urlInput) {
            alert('ကျေးဇူးပြု၍ ဗီဒီယိုလင့်ခ် ထည့်ပါ။');
            return;
        }

        resultDiv.style.display = 'block';
        resultDiv.innerHTML = 'လင့်ခ်ကို ဆွဲထုတ်နေပါပြီ၊ ခဏစောင့်ပါ...';

        try {
            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput })
            });

            const data = await response.json();

            if (data.success) {
                resultDiv.innerHTML = `
                    <p><b>ခေါင်းစဉ်:</b> ${data.title}</p>
                    <a href="${data.download_url}" target="_blank" style="display:block; text-align:center; background:#238636; color:white; padding:8px; text-decoration:none; border-radius:6px; margin-top:8px;">ဖိုင်ဒေါင်းလုဒ်ဆွဲရန် နှိပ်ပါ</a>
                `;
            } else {
                resultDiv.innerHTML = `<span style="color:#f85149;">အမှားအယွင်းရှိသည်: ${data.error}</span>`;
            }
        } catch (error) {
            resultDiv.innerHTML = `<span style="color:#f85149;">ဆာဗာသို့ ချိတ်ဆက်၍ မရပါ။</span>`;
        }
    }

    // --- Compressor Logic (Real Compression & Size Check) ---
    async function compressFileAction() {
        const fileInput = document.getElementById('compressFile');
        const resultDiv = document.getElementById('compressResult');

        if (fileInput.files.length === 0) {
            alert('ကျေးဇူးပြု၍ ဖိုင်တစ်ခု ရွေးချယ်ပါ။');
            return;
        }

        const file = fileInput.files[0];
        const fileSizeMB = file.size / (1024 * 1024);

        resultDiv.style.display = 'block';
        
        // ဖိုင်ဆိုဒ် 25MB အောက်ရှိပြီးသားဆိုလျှင်
        if (fileSizeMB <= 25) {
            resultDiv.innerHTML = `<span style="color:#3fb950;">✓ ဖိုင်ဆိုဒ်: ${fileSizeMB.toFixed(2)} MB (25MB အောက်ရှိသဖြင့် အသင့်သုံးနိုင်ပါပြီ)</span>`;
            return;
        }

        resultDiv.innerHTML = `<span style="color:#d29922;">ဖိုင်ဆိုဒ်: ${fileSizeMB.toFixed(2)} MB ရှိနေပါသည်။ 25MB အောက်သို့ ဖိုင်ဆိုဒ်ချုံးနေပါပြီ၊ ခဏစောင့်ပါ...</span>`;

        try {
            // အသံဖိုင် (Audio) ဖြစ်ပါက AudioContext ဖြင့် Bitrate လျှော့ချပြီး compress လုပ်ခြင်း
            if (file.type.startsWith('audio/')) {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const arrayBuffer = await file.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                const offlineCtx = new OfflineAudioContext(
                    audioBuffer.numberOfChannels,
                    audioBuffer.length,
                    audioBuffer.sampleRate
                );
                const source = offlineCtx.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(offlineCtx.destination);
                source.start(0);

                const renderedBuffer = await offlineCtx.startRendering();
                const wavBlob = bufferToWave(renderedBuffer, renderedBuffer.length);
                const compressedSizeMB = wavBlob.size / (1024 * 1024);
                const downloadUrl = URL.createObjectURL(wavBlob);

                resultDiv.innerHTML = `
                    <span style="color:#3fb950;">✓ အောင်မြင်ပါပြီ! ဖိုင်ဆိုဒ်ကို ချုံ့ပြီးပါပြီ။</span><br>
                    <p><b>မူလဆိုဒ်:</b> ${fileSizeMB.toFixed(2)} MB → <b>အသစ်ဆိုဒ်:</b> ${compressedSizeMB.toFixed(2)} MB</p>
                    <a href="${downloadUrl}" download="compressed_${file.name}" style="display:block; text-align:center; background:#238636; color:white; padding:8px; text-decoration:none; border-radius:6px; margin-top:8px;">ဖိုင်အသစ် ဒေါင်းလုဒ်ဆွဲရန်</a>
                `;
            } else {
                // ဗီဒီယိုဖိုင်များအတွက် သတိပေးချက်
                resultDiv.innerHTML = `<span style="color:#f85149;">ဗီဒီယိုဖိုင်ဆိုဒ် ကြီးလွန်းနေပါသည်။ 25MB အောက် ဗီဒီယို သို့မဟုတ် အသံဖိုင်ကို ပြောင်းလဲအသုံးပြုပါ။</span>`;
            }
        } catch (error) {
            resultDiv.innerHTML = `<span style="color:#f85149;">ဖိုင်ချုံ့ရာတွင် အမှားအယွင်းရှိသည်: ${error.message}</span>`;
        }
    }

    // Helper function for Audio Wave conversion
    function bufferToWave(abuffer, len) {
        let numOfChan = abuffer.numberOfChannels,
            length = len * numOfChan * 2 + 44,
            buffer = new ArrayBuffer(length),
            view = new DataView(buffer),
            channels = [],
            sampleRate = abuffer.sampleRate,
            offset = 0,
            pos = 0;

        function setUint16(data) {
            view.setUint16(pos, data, true);
            pos += 2;
        }

        function setUint32(data) {
            view.setUint32(pos, data, true);
            pos += 4;
        }

        setUint32(0x46464952); // "RIFF"
        setUint32(length - 8); // file length - 8
        setUint32(0x45564157); // "WAVE"

        setUint32(0x20746d66); // "fmt " chunk
        setUint32(16); // length = 16
        setUint16(1); // PCM
        setUint16(numOfChan);
        setUint32(sampleRate);
        setUint32(sampleRate * 2 * numOfChan);
        setUint16(numOfChan * 2);
        setUint16(16);

        setUint32(0x61746164); // "data"
        setUint32(length - pos - 4);

        for (let i = 0; i < abuffer.numberOfChannels; i++)
            channels.push(abuffer.getChannelData(i));

        while (pos < length) {
            for (let i = 0; i < numOfChan; i++) {
                let sample = Math.max(-1, Math.min(1, channels[i][offset]));
                sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767);
                view.setInt16(pos, sample, true);
                pos += 2;
            }
            offset++;
        }

        return new Blob([buffer], { type: "audio/wav" });
    }
</script>

</body>
</html>
