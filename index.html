<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio Pro - Dialogue Transcription</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">
    <div class="max-w-2xl mx-auto">
        <header class="mb-6">
            <h1 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                <span>⚡</span> AI Video Studio Pro
            </h1>
            <p class="text-xs text-slate-400">အသံဖိုင်မှ မြန်မာစာ Dialogue စာသားများ အလိုအလျောက် ထုတ်ယူခြင်း</p>
        </header>

        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-xl space-y-4">
            <h2 class="text-sm font-semibold text-amber-300 flex items-center gap-2">
                <span>🎙️</span> အသံဖိုင်မှ စာသားထုတ်ယူရန် (Groq API)
            </h2>

            <!-- Groq API Key Input -->
            <div>
                <label class="block text-xs text-slate-400 mb-1">🔑 Groq API Key ထည့်ပါ:</label>
                <input type="password" id="apiKeyInput" placeholder="gsk_..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-amber-400">
            </div>
            
            <!-- Audio File Input -->
            <div>
                <label class="block text-xs text-slate-400 mb-1">🎵 အသံဖိုင် (သို့) ဗီဒီယိုဖိုင် ရွေးပါ:</label>
                <input type="file" id="audioInput" accept="audio/*,video/*" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-amber-300 hover:file:bg-slate-600 cursor-pointer">
            </div>

            <button id="transcribeBtn" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-medium py-2.5 px-4 rounded-lg text-xs transition flex items-center justify-center gap-2 shadow-lg">
                <span>✨</span> စာသားများ ထုတ်ယူမည် (Transcribe)
            </button>

            <!-- Status Box -->
            <div id="statusBox" class="p-3 rounded-lg text-xs hidden bg-slate-900 border border-slate-700">
                <span id="statusText">အဆင်သင့်ဖြစ်ပါပြီ။</span>
            </div>

            <!-- Result Box -->
            <div id="resultArea" class="hidden space-y-2">
                <label class="block text-xs text-slate-300 font-semibold">📜 ထွက်လာသော မြန်မာစာ Dialogue များ:</label>
                <textarea id="resultOutput" rows="8" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-slate-100 focus:outline-none leading-relaxed" readonly></textarea>
                <button id="copyBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded-lg text-xs transition">
                    📋 စာသားများ ကူးယူရန် (Copy)
                </button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('transcribeBtn').addEventListener('click', async () => {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const fileInput = document.getElementById('audioInput');
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const resultArea = document.getElementById('resultArea');
            const resultOutput = document.getElementById('resultOutput');

            if (!apiKey) {
                statusBox.classList.remove('hidden');
                statusText.innerHTML = '<span class="text-red-400">ကျေးဇူးပြု၍ Groq API Key ထည့်သွင်းပါ။</span>';
                return;
            }

            if (fileInput.files.length === 0) {
                statusBox.classList.remove('hidden');
                statusText.innerHTML = '<span class="text-red-400">ကျေးဇူးပြု၍ အသံဖိုင် သို့မဟုတ် ဗီဒီယိုဖိုင် ရွေးချယ်ပါ။</span>';
                return;
            }

            const mediaFile = fileInput.files[0];
            resultArea.classList.add('hidden');
            statusBox.classList.remove('hidden');
            statusText.textContent = 'အသံဖိုင်ကို Groq API သို့ ပို့ဆောင်နေပါပြီ (ခဏစောင့်ပါ)...';

            try {
                const formData = new FormData();
                formData.append('file', mediaFile);
                formData.append('model', 'whisper-large-v3');
                formData.append('language', 'my'); // မြန်မာဘာသာစကား သတ်မှတ်ချက်
                formData.append('response_format', 'json');

                const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: formData
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || 'API တောင်းဆိုမှု မအောင်မြင်ပါ။');
                }

                const data = await response.json();
                
                statusText.textContent = 'စာသားများ အောင်မြင်စွာ ထွက်ရှိလာပါပြီ!';
                resultOutput.value = data.text;
                resultArea.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                statusBox.classList.remove('hidden');
                statusText.innerHTML = `<span class="text-red-400 font-bold">အမှားဖြစ်သွားပါသည်:</span> ${error.message || error}`;
            }
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const resultOutput = document.getElementById('resultOutput');
            resultOutput.select();
            document.execCommand('copy');
            alert('စာသားများကို ကူးယူပြီးပါပြီ!');
        });
    </script>
</body>
</html>
