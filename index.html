<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio 🇲🇲</title>
    
    <!-- FFmpeg.wasm for Browser-side Video Editing -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --success-hover: #059669;
            --border: #334155;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
            background: var(--bg-color); 
            min-height: 100vh;
            color: var(--text-color); 
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 24px;
            color: #60a5fa;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ဘေးချင်းယှဉ် (Grid) Layout */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card { 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            border: 1px solid var(--border);
        }

        h2 { 
            margin-top: 0; 
            color: #60a5fa; 
            font-size: 18px; 
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        label { 
            font-weight: 600; 
            margin-top: 15px; 
            display: block; 
            font-size: 13px; 
            color: var(--text-muted);
        }

        input, select, button, textarea { 
            width: 100%; 
            margin-top: 8px; 
            padding: 12px; 
            border-radius: 10px; 
            border: 1px solid var(--border); 
            background: #0f172a;
            color: var(--text-color);
            box-sizing: border-box; 
            font-size: 14px; 
        }

        input[type="file"] {
            padding: 10px;
            cursor: pointer;
        }

        textarea {
            resize: vertical;
        }

        .key-row { display: flex; gap: 10px; }
        
        .save-key-btn {
            margin-top: 8px; 
            width: 100px; 
            background: var(--success); 
            color: white;
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 10px;
        }
        .save-key-btn:hover { background: var(--success-hover); }
        
        button.main-btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            font-weight: bold; 
            font-size: 14px;
            cursor: pointer; 
            margin-top: 18px; 
            border-radius: 10px; 
            padding: 12px;
            transition: background 0.2s;
        }
        button.main-btn:hover { background: var(--primary-hover); }

        button.cut-btn {
            background: var(--success); 
            color: white; 
            border: none; 
            font-weight: bold; 
            font-size: 14px;
            cursor: pointer; 
            margin-top: 18px; 
            border-radius: 10px; 
            padding: 12px;
        }
        button.cut-btn:hover { background: var(--success-hover); }

        button:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

        .status { margin-top: 12px; font-weight: bold; font-size: 13px; color: #38bdf8; }
        
        .error-box { 
            background: rgba(239, 68, 68, 0.1); 
            border: 1px solid rgba(239, 68, 68, 0.3); 
            border-left: 4px solid #ef4444; 
            padding: 10px; 
            border-radius: 8px; 
            color: #fca5a5; 
            margin-top: 10px; 
            font-size: 13px;
            display: none; 
            word-break: break-all; 
        }

        video { width: 100%; margin-top: 15px; border-radius: 10px; background: #000; max-height: 250px; }
    </style>
</head>
<body>

<header>
    <h1>⚡ AI Video Studio Pro</h1>
    <p>Dialogue စာသားထုတ်ယူခြင်းနှင့် အသံတိတ်အပိုင်းများ အလိုအလျောက် ဖြတ်တောက်ခြင်းစနစ်</p>
</header>

<div class="container">
    
    <!-- ဘယ်ဘက်ခြမ်း : Dialogue စာသားသီးသန့် ထုတ်ယူရန် (Groq API) -->
    <div class="card">
        <h2>🎙️ ၁။ Dialogue စာသားသီးသန့် ထုတ်ရန်</h2>
        
        <label>🔑 API Key ရွေးရန်:</label>
        <select id="activeKeySelect" onchange="onKeySelectionChange()">
            <option value="key1">🔑 API Key (၁)</option>
            <option value="key2">🔑 API Key (၂)</option>
            <option value="key3">🔑 API Key (၃)</option>
        </select>

        <label id="keyInputLabel">🔑 API Key (၁) ထည့်ရန်:</label>
        <div class="key-row">
            <input type="password" id="apiKeyInput" placeholder="gsk_..." autocomplete="off">
            <button type="button" class="save-key-btn" onclick="saveActiveApiKey()">💾 Save</button>
        </div>

        <label>📁 အသံ (သို့) ဗီဒီယိုဖိုင် တင်ပါ:</label>
        <input type="file" id="transcribeFileInput" accept="audio/*,video/*">
        
        <button class="main-btn" onclick="extractDialogues()">✨ Dialogue စာသားများ ထုတ်ယူမည်</button>
        
        <div id="transcribeStatus" class="status"></div>
        <div id="transcribeError" class="error-box"></div>
        
        <label style="margin-top:15px;">📝 ထွက်လာသည့် Dialogue စာသားများ:</label>
        <textarea id="dialogueResult" rows="6" readonly placeholder="✨ စာသားများ ဤနေရာတွင် ပေါ်လာပါမည်..."></textarea>
    </div>

    <!-- ညာဘက်ခြမ်း : အသံတိတ်အပိုင်းများ အလိုအလျောက် ဖြတ်ထုတ်ရန် (Silence Cutter) -->
    <div class="card">
        <h2>✂️ ၂။ အသံတိတ် ဖြတ်ထုတ်ခြင်း & ဆက်ခြင်း</h2>
        
        <label>🎬 ဗီဒီယိုဖိုင် တင်ပါ:</label>
        <input type="file" id="videoCutInput" accept="video/*">

        <button class="cut-btn" onclick="autoRemoveSilence()">✂️ အသံတိတ်များ ဖြတ်ထုတ်မည် (Jump Cut)</button>
        <div id="cutStatus" class="status"></div>

        <video id="outputVideo" controls style="display:none;"></video>
        
        <a id="downloadLink" style="display:none;" download="final_edited_video.mp4">
            <button class="main-btn" style="background: #2563eb; margin-top: 12px;">📥 တည်းဖြတ်ပြီးဗီဒီယို သိမ်းဆည်းရန် (Download)</button>
        </a>
    </div>

</div>

<script>
const { createFFmpeg, fetchFile } = FFmpeg;
let ffmpeg = null;

window.onload = function() {
    loadKeyForSelection();
};

function getSelectedKeyName() {
    return document.getElementById('activeKeySelect').value;
}

function onKeySelectionChange() {
    const selected = getSelectedKeyName();
    const selectElem = document.getElementById('activeKeySelect');
    document.getElementById('keyInputLabel').innerText = `🔑 ${selectElem.options[selectElem.selectedIndex].text} ထည့်ရန်:`;
    loadKeyForSelection();
}

function loadKeyForSelection() {
    const keyName = getSelectedKeyName();
    const savedKey = localStorage.getItem('groq_' + keyName) || '';
    document.getElementById('apiKeyInput').value = savedKey;
}

function saveActiveApiKey() {
    const keyName = getSelectedKeyName();
    const keyValue = document.getElementById('apiKeyInput').value.trim();
    if (keyValue) {
        localStorage.setItem('groq_' + keyName, keyValue);
        alert(`✅ သိမ်းဆည်းပြီးပါပြီ!`);
    } else {
        localStorage.removeItem('groq_' + keyName);
        alert(`🗑️ ဖျက်လိုက်ပါပြီ။`);
    }
}

// FFmpeg Loader
async function initFFmpeg(statusElem) {
    if (!ffmpeg) {
        statusElem.innerText = "⏳ ဗီဒီယိုတည်းဖြတ်စနစ်ကို စတင်ဒေါင်းလုပ်လုပ်နေပါသည် (ခဏစောင့်ပါ)...";
        try {
            ffmpeg = createFFmpeg({ log: true });
            await ffmpeg.load();
        } catch (e) {
            statusElem.innerText = "❌ စနစ်စတင်၍မရပါ။";
            throw e;
        }
    }
}

// ၁။ Dialogue သီးသန့်ထုတ်ယူခြင်း (Groq API)
async function extractDialogues() {
    const keyName = getSelectedKeyName();
    const apiKey = localStorage.getItem('groq_' + keyName) || document.getElementById('apiKeyInput').value.trim();
    const fileInput = document.getElementById('transcribeFileInput');
    const status = document.getElementById('transcribeStatus');
    const resultBox = document.getElementById('dialogueResult');
    const errorBox = document.getElementById('transcribeError');

    errorBox.style.display = 'none';

    if (!apiKey) { alert('⚠️ API Key ထည့်ပါ'); return; }
    if (!fileInput.files[0]) { alert('⚠️ ဖိုင်ရွေးပေးပါ'); return; }

    localStorage.setItem('groq_' + keyName, apiKey);
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    formData.append('model', 'whisper-large-v3');
    formData.append('response_format', 'verbose_json');

    status.innerText = "⏳ စာသားများ ထုတ်ယူနေပါသည်...";
    resultBox.value = "";

    try {
        const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ` + apiKey },
            body: formData
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || 'API Error');

        status.innerText = "✅ Dialogue ထုတ်ယူခြင်း ပြီးစီးပါပြီ။";
        let output = "";
        let validSegments = data.segments.filter(seg => seg.text && seg.text.trim().length > 0);
        validSegments.forEach((seg) => {
            output += seg.text.trim() + " ";
        });
        resultBox.value = output.trim();

    } catch (err) {
        status.innerText = "❌ အမှားတွေ့ရှိပါသည်";
        errorBox.style.display = 'block';
        errorBox.innerText = err.message;
    }
}

// ၂။ အသံတိတ်အပိုင်းများ အလိုအလျောက် ဖြတ်ထုတ်ခြင်း (Silence Cutter)
async function autoRemoveSilence() {
    const fileInput = document.getElementById('videoCutInput');
    const status = document.getElementById('cutStatus');
    const outputVideo = document.getElementById('outputVideo');
    const downloadLink = document.getElementById('downloadLink');

    if (!fileInput.files[0]) {
        alert('⚠️ ကျေးဇူးပြု၍ တည်းဖြတ်မည့် ဗီဒီယိုဖိုင်ကို ရွေးပေးပါ။');
        return;
    }

    try {
        await initFFmpeg(status);
        status.innerText = "⏳ အသံတိတ်နေသော နေရာများကို ဖြတ်တောက်နေပါပြီ (ခဏစောင့်ပါ)...";
        
        const file = fileInput.files[0];
        const inputName = 'input_cut.mp4';
        const outputName = 'output_cut.mp4';
        
        ffmpeg.FS('writeFile', inputName, await fetchFile(file));

        await ffmpeg.run(
            '-i', inputName,
            '-af', 'silenceremove=start_periods=1:start_silence=0.8:start_threshold=-45dB:detection=peak,areverse,silenceremove=start_periods=1:start_silence=0.8:start_threshold=-45dB:detection=peak,areverse',
            '-video_track_timescale', '1000',
            outputName
        );

        status.innerText = "✅ ဗီဒီယိုတည်းဖြတ်ပြီးပါပြီ။ Download ဆွဲနိုင်ပါပြီ!";
        const data = ffmpeg.FS('readFile', outputName);
        
        const blob = new Blob([data.buffer], { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        
        outputVideo.src = url;
        outputVideo.style.display = 'block';
        downloadLink.href = url;
        downloadLink.style.display = 'block';

    } catch (err) {
        status.innerText = "❌ ဗီဒီယိုတည်းဖြတ်ရာတွင် အမှားဖြစ်သွားပါသည်။";
        console.error(err);
    }
}
</script>

</body>
</html>
