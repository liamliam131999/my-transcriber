<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Transcriber - Fast Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: sans-serif; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md">
        <!-- Header -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-xl text-center mb-4">
            <div class="flex justify-center mb-2">
                <i data-lucide="zap" class="w-8 h-8 text-amber-400 fill-amber-400"></i>
            </div>
            <h1 class="text-2xl font-bold text-teal-300 tracking-wide">My Transcriber (Fast)</h1>
            <p class="text-xs text-slate-400 mt-1">Groq Whisper - အမြန်ဆုံး စာသားပြောင်းစနစ်</p>
        </div>

        <!-- Form Area -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Groq API Key ထည့်ရန်</label>
                <input type="password" id="groq-key" placeholder="gsk_..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-teal-500">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">အသံဖိုင် (သို့) ဗီဒီယိုဖိုင် ရွေးပါ (MP3, WAV, MP4)</label>
                <input type="file" id="media-file" accept="audio/*,video/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-teal-950 file:text-teal-300 hover:file:bg-teal-900 cursor-pointer">
            </div>

            <button onclick="startFastTranscript()" id="trans-btn" class="w-full bg-teal-600 hover:bg-teal-500 text-slate-950 font-bold py-2.5 rounded-lg text-xs transition">အမြန်ဆုံး Transcript လုပ်မည်</button>
            
            <!-- Progress / Status -->
            <div id="status-box" class="hidden text-xs text-amber-300 text-center py-2 animate-pulse">ဖိုင်ကို တင်နေပါပြီ... ခဏစောင့်ပါ။</div>

            <!-- Result Box -->
            <div id="result-container" class="hidden space-y-2">
                <label class="block text-xs text-teal-400 font-bold">ရလဒ် စာသားများ:</label>
                <textarea id="groq-result" rows="8" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-200 focus:outline-none" readonly></textarea>
                <button onclick="copyText()" class="w-full bg-slate-800 hover:bg-slate-750 text-teal-300 py-2 rounded-lg text-xs font-semibold">စာသားများ ကူးယူရန် (Copy)</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        async function startFastTranscript() {
            const apiKey = document.getElementById('groq-key').value.trim();
            const fileInput = document.getElementById('media-file');
            const statusBox = document.getElementById('status-box');
            const resultContainer = document.getElementById('result-container');
            const resultBox = document.getElementById('groq-result');
            const btn = document.getElementById('trans-btn');

            if (!apiKey) {
                alert('ကျေးဇူးပြု၍ Groq API Key ထည့်ပါ။');
                return;
            }
            if (fileInput.files.length === 0) {
                alert('ကျေးဇူးပြု၍ ဖိုင်တစ်ခု ရွေးပါ။');
                return;
            }

            const file = fileInput.files[0];
            
            // File size check (25MB limit)
            if (file.size > 25 * 1024 * 1024) {
                alert('ဖိုင်ဆိုဒ် 25MB ထက် ကျော်လွန်နေပါသည်။ ကျေးဇူးပြု၍ ဖိုင်အသေး သို့မဟုတ် Compressor ကို သုံးပါ။');
                return;
            }

            btn.disabled = true;
            statusBox.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            const formData = new FormData();
            formData.append('file', file);
            formData.append('model', 'whisper-large-v3'); // Groq ရဲ့ အမြန်ဆုံးနဲ့ အတိကျဆုံး model
            formData.append('response_format', 'json');

            try {
                const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    resultContainer.classList.remove('hidden');
                    resultBox.value = data.text || "စာသားမတွေ့ရှိပါ။";
                } else {
                    alert('အမှားအယွင်း ဖြစ်ပေါ်သည်: ' + (data.error?.message || 'API Error'));
                }
            } catch (error) {
                alert('ချိတ်ဆက်မှု မအောင်မြင်ပါ: ' + error.message);
            } finally {
                btn.disabled = false;
                statusBox.classList.add('hidden');
            }
        }

        function copyText() {
            const resultBox = document.getElementById('groq-result');
            resultBox.select();
            document.execCommand('copy');
            alert('စာသားများကို ကူးယူပြီးပါပြီ!');
        }
    </script>
</body>
</html>
