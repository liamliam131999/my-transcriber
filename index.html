<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader & Transcriber</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            word-break: break-all;
        }
        .loading {
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Video Downloader</h2>
    <input type="text" id="videoUrl" placeholder="YouTube / Douyin / Bilibili Link ထည့်ပါ...">
    <button onclick="processDownload()">ဒေါင်းလုဒ်လင့်ခ် ရယူမည်</button>
    
    <div id="result"></div>
</div>

<script>
    // Railway Backend API လင့်ခ်
    const BACKEND_URL = "https://my-transcriber-production.up.railway.app/download";

    async function processDownload() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        const resultDiv = document.getElementById('result');

        if (!urlInput) {
            alert('ကျေးဇူးပြု၍ ဗီဒီယိုလင့်ခ် ထည့်ပါ။');
            return;
        }

        resultDiv.innerHTML = '<p class="loading">လင့်ခ်ကို ဆွဲထုတ်နေပါပြီ၊ ခဏစောင့်ပါ...</p>';

        try {
            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ url: urlInput })
            });

            const data = await response.json();

            if (data.success) {
                resultDiv.innerHTML = `
                    <p><b>ခေါင်းစဉ်:</b> ${data.title}</p>
                    <a href="${data.download_url}" target="_blank" style="display:block; text-align:center; background:#28a745; color:white; padding:10px; text-decoration:none; border-radius:5px; margin-top:10px;">ဖိုင်ဒေါင်းလုဒ်ဆွဲရန် နှိပ်ပါ</a>
                `;
            } else {
                resultDiv.innerHTML = `<p style="color:red;">အမှားအယွင်းရှိသည်: ${data.error}</p>`;
            }
        } catch (error) {
            console.error(error);
            resultDiv.innerHTML = `<p style="color:red;">ဆာဗာသို့ ချိတ်ဆက်၍ မရပါ။</p>`;
        }
    }
</script>

</body>
</html>
