<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialogue Transcriber & Auto Silence Video Cutter 🇲🇲</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">

    <!-- FFmpeg.wasm for Browser-side Video Editing -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>

    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            max-width: 680px; 
            margin: 20px auto; 
            padding: 15px; 
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%); 
            min-height: 100vh;
            color: #2c3e50; 
        }
        .card { 
            background: #ffffff; 
            padding: 28px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.12); 
            margin-bottom: 25px;
        }
        h2 { 
            margin-top: 0; 
            color: #1a73e8; 
            font-size: 20px; 
            text-align: center;
            border-bottom: 2px dashed #e0e0e0;
            padding-bottom: 12px;
        }
        h3 {
            font-size: 17px;
            color: #059669;
            margin-top: 0;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }
        label { 
            font-weight: 600; 
            margin-top: 15px; 
            display: block; 
            font-size: 14px; 
        }
        input, select, button, textarea { 
            width: 100%; 
            margin-top: 8px; 
            padding: 12px 14px; 
            border-radius: 10px; 
            border: 1px solid #cbd5e1; 
            box-sizing: border-box; 
            font-size: 14px; 
        }
        .key-row { display: flex; gap: 10px; }
        .save-key-btn {
            margin-top: 8px; width: 120px; background: #059669; color: white;
            border: none; font-weight: bold; cursor: pointer; border-radius: 10px;
        }
        .save-key-btn:hover { background: #047857; }
        
        button.main-btn { 
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); 
            color: white; border: none; font-weight: bold; font-size: 15px;
            cursor: pointer; margin-top: 18px; border-radius: 10px; padding: 13px;
        }
        button.cut-btn {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white; border: none; font-weight: bold; font-size: 15px;
            cursor: pointer; margin-top: 18px; border-radius: 10px; padding: 13px;
        }
        button:disabled { background: #94a3b8; cursor: not-allowed; }

        .status { margin-top: 10px; font-weight: bold; font-size: 13px; color: #334155; }
        .error-box { 
            background: #fef2f2; border: 1px solid #fecaca; border-left: 5px solid #ef4444; 
            padding: 12px; border-radius: 10px; color: #991b1b; margin-top: 12px; display: none; word-break: break-all;
        }
        video { width: 100%; margin-top: 15px; border-radius: 10px; background: #000; }
    </style>
</head>
<body>

<!-- အပိုင်း (၁) : Dialogue သီးသန့် ထုတ်ပေးမည့်နေရာ -->
<div class="card">
    <h2>🎙️ ဇာတ်ကောင်ပြောသော Dialogue စာသားများ သီးသန့်ထုတ်ရန်</h2>
    
    <label>🔑 API Key ရွေးရန်:</label>
    <select id="activeKeySelect" onchange="onKeySelectionChange()">
        <option value="key1">🔑 API Key (၁)</option>
        <option value="key2">🔑 API Key (၂)</option>
        <option value="key3">🔑 API Key (၃)</option>
    </select>

    <label id="keyInputLabel">🔑 API Key (၁) ထည့်ရန်:</label>
    <div class="key-row">
        <input type="password" id="apiKeyInput" placeholder="gsk_..." autocomplete="off">
        <button type="button" class="save-key-btn" onclick="saveActiveApiKey()">💾 Save</button>
    </div>

    <label>📁 အသံ (သို့) ဗီဒီယိုဖိုင် တင်ပါ:</label>
    <input type="file" id="transcribeFileInput" accept="audio/*,video/*">
    
    <button class="main-btn" onclick="extractDialogues()">✨ Dialogue စာသားများ သီးသန့်ထုတ်ယူမည်</button>
    
    <div id="transcribeStatus" class="status"></div>
    <div id="transcribeError" class="error-box"></div>
    
    <label style="margin-top:18px;">📝 ထွက်လာသည့် Dialogue စာသားများ (Timestamp မပါ):</label>
    <textarea id="dialogueResult" rows="6" readonly placeholder="✨ ဇာတ်ကောင်ပြောသည့် စာသားများသာ ဤနေရာတွင် ပေါ်လာပါမည်..."></textarea>
</div>

<!-- အပိုင်း (၂) : ဗီဒီယို အသံတိတ်အပိုင်းများ အလိုအလျောက် ဖြတ်ထုတ်မည့်နေရာ -->
<div class="card">
    <h3>✂️ Auto Silence Video Cutter (အသံတိတ်များ ဖယ်ရှားရန်)</h3>
    <p style="font-size: 13px; color: #64748b; margin-top: 2px;">ဗီဒီယိုဖိုင်တင်လိုက်တာနဲ့ အသံတိတ်နေတဲ့နေရာတွေကို အလိုအလျောက်ဖျတ်ပြီး ပြီးသားဗီဒီယိုကို သိမ်းဆည်းနိုင်ပါတယ်။</p>

    <label>🎬 ဗီဒီယိုဖိုင် တင်ပါ:</label>
    <input type="file" id="videoCutInput" accept="video/*">

    <button class="cut-btn" onclick="autoRemoveSilence()">✂️ အသံတိတ်အပိုင်းများ ဖြတ်ထုတ်ပြီး ဗီဒီယိုထုတ်မည်</button>
    <div id="cutStatus" class="status"></div>

    <label style="margin-top:15px;">▶️ တည်းဖြတ်ပြီး ဗီဒီယိုအချောထည် (Preview & Download):</label>
    <video id="outputVideo" controls style="display:none;"></video>
    <a id="downloadLink" style="display:none; margin-top: 12px;" download="final_edited_video.mp4">
        <button class="main-btn" style="background: #0d9488; margin-top: 5px;">📥 ဗီဒီယိုကို ဖုန်းထဲသို့ Save / Download လုပ်ရန်</button>
    </a>
</div>

<script>
const { createFFmpeg, fetchFile } = FFmpeg;
let ffmpeg = null;

window.onload = function() {
    loadKeyForSelection();
};

function getSelectedKeyName() {
    return document.getElementById('activeKeySelect').value;
}

function onKeySelectionChange() {
    const selected = getSelectedKeyName();
    const selectElem = document.getElementById('activeKeySelect');
    document.getElementById('keyInputLabel').innerText = `🔑 ${selectElem.options[selectElem.selectedIndex].text} ထည့်ရန်:`;
    loadKeyForSelection();
}

function loadKeyForSelection() {
    const keyName = getSelectedKeyName();
    const savedKey = localStorage.getItem('groq_' + keyName) || '';
    document.getElementById('apiKeyInput').value = savedKey;
}

function saveActiveApiKey() {
    const keyName = getSelectedKeyName();
    const keyValue = document.getElementById('apiKeyInput').value.trim();
    if (keyValue) {
        localStorage.setItem('groq_' + keyName, keyValue);
        alert(`✅ သိမ်းဆည်းပြီးပါပြီ!`);
    } else {
        localStorage.removeItem('groq_' + keyName);
        alert(`🗑️ ဖျက်လိုက်ပါပြီ။`);
    }
}

// ၁။ Dialogue သီးသန့်ထုတ်ယူခြင်း (Timestamp လုံးဝမပါ)
async function extractDialogues() {
    const keyName = getSelectedKeyName();
    const apiKey = localStorage.getItem('groq_' + keyName) || document.getElementById('apiKeyInput').value.trim();
    const fileInput = document.getElementById('transcribeFileInput');
    const status = document.getElementById('transcribeStatus');
    const resultBox = document.getElementById('dialogueResult');
    const errorBox = document.getElementById('transcribeError');

    errorBox.style.display = 'none';

    if (!apiKey) { alert('⚠️ API Key ထည့်ပါ'); return; }
    if (!fileInput.files[0]) { alert('⚠️ ဖိုင်ရွေးပေးပါ'); return; }

    localStorage.setItem('groq_' + keyName, apiKey);
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    formData.append('model', 'whisper-large-v3');
    formData.append('response_format', 'verbose_json');

    status.innerText = "⏳ စာသားများ ထုတ်ယူနေပါသည်...";
    resultBox.value = "";

    try {
        const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ` + apiKey },
            body: formData
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || 'API Error');

        status.innerText = "✅ Dialogue ထုတ်ယူခြင်း ပြီးစီးပါပြီ။";
        let output = "";

        let validSegments = data.segments.filter(seg => seg.text && seg.text.trim().length > 0);
        validSegments.forEach((seg) => {
            output += seg.text.trim() + " ";
        });
        
        resultBox.value = output.trim();

    } catch (err) {
        status.innerText = "❌ အမှားတွေ့ရှိပါသည်";
        errorBox.style.display = 'block';
        errorBox.innerText = err.message;
    }
}

// ၂။ ဗီဒီယို အသံတိတ်အပိုင်းများ အလိုအလျောက် ဖြတ်ထုတ်ခြင်း (FFmpeg)
async function autoRemoveSilence() {
    const fileInput = document.getElementById('videoCutInput');
    const cutStatus = document.getElementById('cutStatus');
    const outputVideo = document.getElementById('outputVideo');
    const downloadLink = document.getElementById('downloadLink');

    if (!fileInput.files[0]) {
        alert('⚠️ ကျေးဇူးပြု၍ တည်းဖြတ်မည့် ဗီဒီယိုဖိုင်ကို ရွေးပေးပါ။');
        return;
    }

    if (!ffmpeg) {
        cutStatus.innerText = "⏳ ဗီဒီယို တည်းဖြတ်စနစ်ကို စတင်ဒေါင်းလုပ်လုပ်နေပါသည် (ခဏစောင့်ပါ)...";
        try {
            ffmpeg = createFFmpeg({ log: true });
            await ffmpeg.load();
        } catch (e) {
            cutStatus.innerText = "❌ စနစ်စတင်၍မရပါ။";
            return;
        }
    }

    cutStatus.innerText = "⏳ ဗီဒီယိုထဲမှ အသံတိတ်နေသော နေရာများကို ရှာဖွေဖြတ်တောက်နေပါပြီ...";
    const file = fileInput.files[0];
    const inputName = 'input_video.mp4';
    
    ffmpeg.FS('writeFile', inputName, await fetchFile(file));

    try {
        // FFmpeg silencedetect filter ကိုသုံးပြီး အသံတိတ်တဲ့ အပိုင်းတွေကို အလိုအလျောက် ဖြတ်ထုတ်ရန်
        // (-1:32 silenceremove filter)
        await ffmpeg.run(
            '-i', inputName,
            '-af', 'silenceremove=start_periods=1:start_silence=0.8:start_threshold=-45dB:detection=peak,areverse,silenceremove=start_periods=1:start_silence=0.8:start_threshold=-45dB:detection=peak,areverse',
            '-video_track_timescale', '1000',
            'output_video.mp4'
        );

        cutStatus.innerText = "✅ ဗီဒီယိုတည်းဖြတ်ပြီးပါပြီ။ Download ဆွဲနိုင်ပါပြီ!";
        const data = ffmpeg.FS('readFile', 'output_video.mp4');
        
        const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
        const videoUrl = URL.createObjectURL(videoBlob);
        
        outputVideo.src = videoUrl;
        outputVideo.style.display = 'block';
        downloadLink.href = videoUrl;
        downloadLink.style.display = 'block';

    } catch (err) {
        cutStatus.innerText = "❌ ဗီဒီယိုတည်းဖြတ်ရာတွင် အမှားဖြစ်သွားပါသည်။";
        console.error(err);
    }
}
</script>

</body>
</html>
