<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio Pro - Fixed Version</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">
    <div class="max-w-2xl mx-auto space-y-6">
        <header class="mb-4">
            <h1 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                <span>⚡</span> AI Video Studio Pro
            </h1>
            <p class="text-xs text-slate-400">တရုတ်အသံမှ စာသားထုတ်ခြင်း၊ Groq ဖြင့် မြန်မာလိုဘာသာပြန်ခြင်း၊ အသံထွက်ခြင်းနှင့် ဖိုင်သိမ်းဆည်းခြင်း</p>
        </header>

        <!-- Option 1: Chinese Audio to Chinese Text (Groq Whisper) -->
        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-xl space-y-4">
            <h2 class="text-sm font-semibold text-amber-300 flex items-center gap-2">
                <span>🇨🇳</span> ၁။ တရုတ်အသံမှ မူရင်းတရုတ်စာသား ထုတ်ရန် (Groq Whisper API)
            </h2>
            
            <div>
                <label class="block text-xs text-slate-400 mb-1">🔑 Groq API Key (အပေါ်ပိုင်းအတွက်):</label>
                <input type="password" id="groqApiKeyInput" placeholder="gsk_..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-amber-400 mb-3">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">🎵 တရုတ်အသံဖိုင် (သို့) ဗီဒီယိုဖိုင် ရွေးပါ:</label>
                <input type="file" id="audioInput" accept="audio/*,video/*" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-amber-300 hover:file:bg-slate-600 cursor-pointer">
            </div>

            <button id="transcribeBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 px-4 rounded-lg text-xs transition flex items-center justify-center gap-2 shadow-lg">
                <span>🎯</span> တရုတ်စာသားများ ထုတ်ယူမည် (Transcribe)
            </button>

            <!-- Status Box -->
            <div id="statusBox" class="p-3 rounded-lg text-xs hidden bg-slate-900 border border-slate-700">
                <span id="statusText">အဆင်သင့်ဖြစ်ပါပြီ။</span>
            </div>

            <!-- Result Box (Chinese) -->
            <div id="resultArea" class="hidden space-y-2">
                <label class="block text-xs text-slate-300 font-semibold">📜 ထွက်လာသော မူရင်းတရုတ်စာသားများ:</label>
                <textarea id="resultOutput" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-slate-100 focus:outline-none leading-relaxed"></textarea>
                <button id="copyChineseBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded-lg text-xs transition">
                    📋 တရုတ်စာသားများ ကူးယူရန် (Copy)
                </button>
            </div>
        </div>

        <!-- Option 2: Translate Chinese Text to Burmese (Groq API) + Voiceover & Download -->
        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-xl space-y-4">
            <h2 class="text-sm font-semibold text-amber-300 flex items-center gap-2">
                <span>🇲🇲</span> ၂။ ထွက်လာတဲ့တရုတ်စာကို မြန်မာဘာသာသို့ ဘာသာပြန်ရန် (Groq API)
            </h2>
            
            <div>
                <label class="block text-xs text-slate-400 mb-1">🔑 Groq API Key (အောက်ပိုင်း ဘာသာပြန်အတွက်):</label>
                <input type="password" id="translateApiKeyInput" placeholder="gsk_..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-amber-400">
            </div>

            <button id="translateBtn" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-medium py-2.5 px-4 rounded-lg text-xs transition flex items-center justify-center gap-2 shadow-lg">
                <span>🔄</span> မြန်မာဘာသာသို့ အလိုအလျောက် ဘာသာပြန်မည် (Translate)
            </button>

            <!-- Translation Status Box -->
            <div id="translateStatusBox" class="p-3 rounded-lg text-xs hidden bg-slate-900 border border-slate-700">
                <span id="translateStatusText">အဆင်သင့်ဖြစ်ပါပြီ။</span>
            </div>

            <!-- Result Box (Burmese) -->
            <div id="translationArea" class="hidden space-y-3">
                <label class="block text-xs text-slate-300 font-semibold">🇲🇲 ဘာသာပြန်ထားသော မြန်မာစာ Dialogue များ:</label>
                <textarea id="translationOutput" rows="6" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-slate-100 focus:outline-none leading-relaxed"></textarea>
                
                <!-- Action Buttons: Copy, Voiceover, Download -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <button id="copyBurmeseBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-3 rounded-lg text-xs transition flex items-center justify-center gap-1">
                        <span>📋</span> ကူးယူရန် (Copy)
                    </button>
                    <button id="voiceoverBtn" class="bg-purple-600 hover:bg-purple-500 text-white font-medium py-2 px-3 rounded-lg text-xs transition flex items-center justify-center gap-1">
                        <span>🔊</span> အသံထွက်ဖတ်ရန် (Voiceover)
                    </button>
                    <button id="downloadBtn" class="bg-teal-600 hover:bg-teal-500 text-white font-medium py-2 px-3 rounded-lg text-xs transition flex items-center justify-center gap-1">
                        <span>💾</span> ဖိုင်သိမ်းရန် (Download)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Option 1: Transcribe Audio to Chinese (Groq Whisper)
        document.getElementById('transcribeBtn').addEventListener('click', async () => {
            const apiKey = document.getElementById('groqApiKeyInput').value.trim();
            const fileInput = document.getElementById('audioInput');
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const resultArea = document.getElementById('resultArea');
            const resultOutput = document.getElementById('resultOutput');

            if (!apiKey) {
                statusBox.classList.remove('hidden');
                statusText.innerHTML = '<span class="text-red-400">ကျေးဇူးပြု၍ အပေါ်က Groq API Key ထည့်သွင်းပါ။</span>';
                return;
            }

            if (fileInput.files.length === 0) {
                statusBox.classList.remove('hidden');
                statusText.innerHTML = '<span class="text-red-400">ကျေးဇူးပြု၍ အသံဖိုင် သို့မဟုတ် ဗီဒီယိုဖိုင် ရွေးချယ်ပါ။</span>';
                return;
            }

            const mediaFile = fileInput.files[0];
            resultArea.classList.add('hidden');
            statusBox.classList.remove('hidden');
            statusText.textContent = 'တရုတ်အသံဖိုင်ကို Groq API သို့ ပို့ဆောင်နေပါပြီ (ခဏစောင့်ပါ)...';

            try {
                const formData = new FormData();
                formData.append('file', mediaFile);
                formData.append('model', 'whisper-large-v3');
                formData.append('language', 'zh'); 
                formData.append('response_format', 'json');

                const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${apiKey}` },
                    body: formData
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || 'API တောင်းဆိုမှု မအောင်မြင်ပါ။');
                }

                const data = await response.json();
                statusText.textContent = 'တရုတ်စာသားများ အောင်မြင်စွာ ထွက်ရှိလာပါပြီ!';
                resultOutput.value = data.text;
                resultArea.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                statusBox.classList.remove('hidden');
                statusText.innerHTML = `<span class="text-red-400 font-bold">အမှားဖြစ်သွားပါသည်:</span> ${error.message || error}`;
            }
        });

        // Option 2: Translate using Groq API with robust fallback
        document.getElementById('translateBtn').addEventListener('click', async () => {
            const apiKey = document.getElementById('translateApiKeyInput').value.trim();
            const chineseText = document.getElementById('resultOutput').value.trim();
            const translateStatusBox = document.getElementById('translateStatusBox');
            const translateStatusText = document.getElementById('translateStatusText');
            const translationArea = document.getElementById('translationArea');
            const translationOutput = document.getElementById('translationOutput');

            if (!apiKey) {
                translateStatusBox.classList.remove('hidden');
                translateStatusText.innerHTML = '<span class="text-red-400">ကျေးဇူးပြု၍ အောက်က Groq API Key ထည့်သွင်းပါ။</span>';
                return;
            }

            if (!chineseText) {
                translateStatusBox.classList.remove('hidden');
                translateStatusText.innerHTML = '<span class="text-red-400">ဘာသာပြန်ရန် တရုတ်စာသား မရှိသေးပါ။</span>';
                return;
            }

            translationArea.classList.add('hidden');
            translateStatusBox.classList.remove('hidden');
            translateStatusText.textContent = 'Groq API ဖြင့် မြန်မာဘာသာသို့ ဘာသာပြန်ဆိုနေပါပြီ...';

            const modelsList = ['llama-3.1-8b-instant', 'llama-3.3-70b-versatile', 'gemma2-9b-it'];
            let translatedText = null;

            try {
                for (let model of modelsList) {
                    translateStatusText.textContent = `Model (${model}) ဖြင့် ဘာသာပြန်နေသည်...`;
                    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: model,
                            messages: [
                                { role: 'user', content: `Translate this Chinese text to natural Burmese language for video recaps. Only output the Burmese translation:\n\n${chineseText}` }
                            ],
                            temperature: 0.3
                        })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        if (data.choices && data.choices.length > 0) {
                            translatedText = data.choices[0].message.content.trim();
                            break;
                        }
                    }
                }

                if (translatedText) {
                    translateStatusText.textContent = 'မြန်မာဘာသာသို့ အောင်မြင်စွာ ဘာသာပြန်ပြီးပါပြီ!';
                    translationOutput.value = translatedText;
                    translationArea.classList.remove('hidden');
                } else {
                    throw new Error('ဘာသာပြန်စာသား ထွက်မလာပါ။');
                }

            } catch (error) {
                console.error(error);
                translateStatusBox.classList.remove('hidden');
                translateStatusText.innerHTML = `<span class="text-red-400 font-bold">ဘာသာပြန်အမှား:</span> ${error.message || error}`;
            }
        });

        // Copy buttons
        document.getElementById('copyChineseBtn').addEventListener('click', () => {
            const el = document.getElementById('resultOutput');
            el.select();
            navigator.clipboard.writeText(el.value).then(() => alert('တရုတ်စာသားများကို ကူးယူပြီးပါပြီ!'));
        });

        document.getElementById('copyBurmeseBtn').addEventListener('click', () => {
            const el = document.getElementById('translationOutput');
            el.select();
            navigator.clipboard.writeText(el.value).then(() => alert('မြန်မာစာသားများကို ကူးယူပြီးပါပြီ!'));
        });

        // Voiceover Feature (Web Speech API)
        document.getElementById('voiceoverBtn').addEventListener('click', () => {
            const textToSpeak = document.getElementById('translationOutput').value.trim();
            if (!textToSpeak) {
                alert('ဖတ်ပြရန် မြန်မာစာသား မရှိသေးပါ။');
                return;
            }

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'my-MM';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('သင့်ဘရောက်ဆာ သို့မဟုတ် စက်တွင် Voiceover စနစ်ကို မပံ့ပိုးပါ။');
            }
        });

        // Save and Download Feature (.txt file export)
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const textContent = document.getElementById('translationOutput').value.trim();
            if (!textContent) {
                alert('ဒေါင်းလုပ်ဆွဲရန် စာသား မရှိသေးပါ။');
                return;
            }

            const filename = 'movie_recap_burmese.txt';
            let element = document.createElement('a');
            let file = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            element.href = URL.createObjectURL(file);
            element.download = filename;
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        });
    </script>
</body>
</html>
