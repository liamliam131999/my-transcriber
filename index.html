<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-API Key Audio & Video Transcriber 🇲🇲</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">

    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            max-width: 680px; 
            margin: 20px auto; 
            padding: 15px; 
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%); 
            min-height: 100vh;
            color: #2c3e50; 
        }
        .card { 
            background: #ffffff; 
            padding: 28px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.12); 
        }
        h2 { 
            margin-top: 0; 
            color: #1a73e8; 
            font-size: 22px; 
            text-align: center;
            border-bottom: 2px dashed #e0e0e0;
            padding-bottom: 12px;
        }
        label { 
            font-weight: 600; 
            margin-top: 18px; 
            display: block; 
            font-size: 15px; 
        }
        input, select, button, textarea { 
            width: 100%; 
            margin-top: 8px; 
            padding: 12px 14px; 
            border-radius: 10px; 
            border: 1px solid #cbd5e1; 
            box-sizing: border-box; 
            font-size: 14px; 
            transition: all 0.2s ease;
        }
        input:focus, select:focus { 
            border-color: #1a73e8; 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(26,115,232,0.2);
        }
        .key-row {
            display: flex;
            gap: 10px;
        }
        .save-key-btn {
            margin-top: 8px;
            width: 120px;
            background: #059669;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 10px;
        }
        .save-key-btn:hover { background: #047857; }
        
        button.main-btn { 
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); 
            color: white; 
            border: none; 
            font-weight: bold; 
            font-size: 16px;
            cursor: pointer; 
            margin-top: 22px; 
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(37,99,235,0.3);
            padding: 14px;
        }
        button.main-btn:hover { transform: translateY(-1px); }

        button.script-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: white;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(124,58,237,0.3);
            padding: 12px;
        }
        button.script-btn:hover { background: #5b21b6; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }

        #status { margin-top: 15px; font-weight: bold; font-size: 14px; color: #334155; }
        
        .limit-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 13px;
            color: #475569;
        }

        .error-box { 
            background: #fef2f2; 
            border: 1px solid #fecaca;
            border-left: 5px solid #ef4444; 
            padding: 14px; 
            border-radius: 10px; 
            color: #991b1b; 
            margin-top: 15px; 
            display: none; 
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🎬 Multi-API Key Audio & Video Transcriber 🇲🇲</h2>
    
    <label>🔑 သုံးမည့် API Key ကို ရွေးပါ:</label>
    <select id="activeKeySelect" onchange="onKeySelectionChange()">
        <option value="key1">🔑 API Key (၁)</option>
        <option value="key2">🔑 API Key (၂)</option>
        <option value="key3">🔑 API Key (၃)</option>
    </select>

    <label id="keyInputLabel">🔑 API Key (၁) ထည့်ရန်:</label>
    <div class="key-row">
        <input type="password" id="apiKeyInput" placeholder="gsk_..." autocomplete="off">
        <button type="button" class="save-key-btn" onclick="saveActiveApiKey()">💾 Save</button>
    </div>

    <label>🧩 Part ရွေးပါ:</label>
    <select id="partSelect">
        <option value="0">▶️ Part 1 (00:00:00 မှ စမည်)</option>
        <option value="1200">⏩ Part 2 (00:20:00 မှ စမည်)</option>
        <option value="2400">⏩ Part 3 (00:40:00 မှ စမည်)</option>
        <option value="3600">⏩ Part 4 (01:00:00 မှ စမည်)</option>
    </select>

    <label>🗣️ မူရင်း အသံ/ဗီဒီယို ဘာသာစကား:</label>
    <select id="langSelect">
        <option value="zh">🇨🇳 တရုတ်ဘာသာ (Chinese)</option>
        <option value="en">🇬🇧 အင်္ဂလိပ်ဘာသာ (English)</option>
        <option value="auto">🌐 အလိုအလျောက် (Auto Detect)</option>
    </select>

    <label>📁 Audio သို့မဟုတ် Video ဖိုင် တင်ပါ:</label>
    <input type="file" id="fileInput" accept="audio/*,video/*">
    
    <button id="transcribeBtn" class="main-btn" onclick="transcribe()">🚀 ရွေးထားသော Key ဖြင့် စာသားထုတ်ယူမည်</button>
    
    <div id="status"></div>
    <div id="limitInfo" class="limit-box" style="display:none;"></div>
    <div id="errorBox" class="error-box"></div>
    
    <label style="margin-top:22px;">📝 ထွက်လာသည့် စာသားရလဒ် (Transcript):</label>
    <textarea id="result" rows="8" readonly placeholder="✨ စာသားများ ဤနေရာတွင် ပေါ်လာပါမည်..."></textarea>

    <button id="scriptBtn" class="script-btn" onclick="generateRecapScript()" disabled>✨ ဤစာသားများမှ ဇာတ်လမ်း Recap Script ရေးပေးမည်</button>

    <label style="margin-top:22px;">🎬 ဗီဒီယို Recap Script ရလဒ်:</label>
    <textarea id="scriptResult" rows="10" readonly placeholder="✨ Recap ဇာတ်ညွှန်းများ ဤနေရာတွင် ပေါ်လာပါမည်..."></textarea>
</div>

<script>
window.onload = function() {
    loadKeyForSelection();
};

function getSelectedKeyName() {
    return document.getElementById('activeKeySelect').value;
}

function onKeySelectionChange() {
    const selected = getSelectedKeyName();
    const selectElem = document.getElementById('activeKeySelect');
    const labelElem = document.getElementById('keyInputLabel');
    
    labelElem.innerText = `🔑 ${selectElem.options[selectElem.selectedIndex].text} ထည့်ရန်:`;
    loadKeyForSelection();
}

function loadKeyForSelection() {
    const keyName = getSelectedKeyName();
    const savedKey = localStorage.getItem('groq_' + keyName) || '';
    document.getElementById('apiKeyInput').value = savedKey;
}

function saveActiveApiKey() {
    const keyName = getSelectedKeyName();
    const keyValue = document.getElementById('apiKeyInput').value.trim();
    if (keyValue) {
        localStorage.setItem('groq_' + keyName, keyValue);
        alert(`✅ ${document.getElementById('activeKeySelect').selectedOptions[0].text} ကို သိမ်းဆည်းပြီးပါပြီ!`);
    } else {
        localStorage.removeItem('groq_' + keyName);
        alert(`🗑️ Key ကို ဖျက်လိုက်ပါပြီ။`);
    }
}

function formatTime(seconds) {
    const pad = (num) => String(num).padStart(2, '0');
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);
    return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
}

async function transcribe() {
    const keyName = getSelectedKeyName();
    const apiKey = localStorage.getItem('groq_' + keyName) || document.getElementById('apiKeyInput').value.trim();
    
    const fileInput = document.getElementById('fileInput');
    const offsetSeconds = parseInt(document.getElementById('partSelect').value);
    const selectedLang = document.getElementById('langSelect').value;
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const scriptResult = document.getElementById('scriptResult');
    const errorBox = document.getElementById('errorBox');
    const limitInfo = document.getElementById('limitInfo');
    const scriptBtn = document.getElementById('scriptBtn');

    errorBox.style.display = 'none';
    limitInfo.style.display = 'none';

    if (!apiKey) { 
        alert('⚠️ ကျေးဇူးပြု၍ ရွေးချယ်ထားသော API Key ထည့်ပြီး Save ခလုတ်ကို အရင်နှိပ်ပါ'); 
        return; 
    }
    if (!fileInput.files[0]) { 
        alert('⚠️ ကျေးဇူးပြု၍ Audio သို့မဟုတ် Video ဖိုင် ရွေးပေးပါ'); 
        return; 
    }

    localStorage.setItem('groq_' + keyName, apiKey);

    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append('file', file);
    formData.append('model', 'whisper-large-v3');
    formData.append('response_format', 'verbose_json');
    if (selectedLang !== 'auto') formData.append('language', selectedLang);

    status.innerText = "⏳ ဖိုင်မှ စာသားထုတ်ယူနေပါသည် (ခဏစောင့်ပါ)...";
    result.value = "";
    scriptResult.value = "";
    scriptBtn.disabled = true;

    try {
        const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ` + apiKey },
            body: formData
        });

        const data = await response.json();
        
        if (!response.ok) {
            let errMessage = data.error?.message || 'Transcription API Error';
            const matchTime = errMessage.match(/try again in ([0-9ms\.]+)/);
            const matchLimit = errMessage.match(/Limit ([0-9]+), Used ([0-9]+)/);
            
            if (matchLimit) {
                limitInfo.style.display = 'block';
                limitInfo.innerHTML = `📊 <b>Rate Limit အခြေအနေ:</b><br>• အသုံးပြုခွင့် အများဆုံး: ${matchLimit[1]} စက္ကန့်<br>• သုံးပြီးသား: ${matchLimit[2]} စက္ကန့်<br><br>💡 <i>အကြံပြုချက်: အခြား API Key သို့ ပြောင်းသုံးပါ။</i>`;
            }
            
            if (matchTime) {
                throw new Error(`Rate limit ပြည့်သွားပါပြီ။ (${matchTime[1]}) စောင့်ပါ (သို့) အခြား API Key သို့ ပြောင်းသုံးပါ။`);
            } else {
                throw new Error(errMessage);
            }
        }

        status.innerText = "✅ စာသားထုတ်ယူခြင်း အောင်မြင်ပါသည်။";
        let output = "";
        data.segments.forEach((seg) => {
            const start = formatTime(seg.start + offsetSeconds);
            const end = formatTime(seg.end + offsetSeconds);
            const text = seg.text.trim();
            output += `[${start} - ${end}] ${text}\n`;
        });
        
        result.value = output;
        scriptBtn.disabled = false;

    } catch (err) {
        status.innerText = "❌ အမှားတွေ့ရှိပါသည်";
        errorBox.style.display = 'block';
        errorBox.innerText = err.message;
    }
}

async function generateRecapScript() {
    const keyName = getSelectedKeyName();
    const apiKey = localStorage.getItem('groq_' + keyName) || document.getElementById('apiKeyInput').value.trim();
    const transcriptText = document.getElementById('result').value;
    const status = document.getElementById('status');
    const scriptResult = document.getElementById('scriptResult');
    const errorBox = document.getElementById('errorBox');

    if (!transcriptText) {
        alert('⚠️ ထုတ်ယူထားသော စာသားများ မရှိသေးပါ။');
        return;
    }

    status.innerText = "⏳ ဗီဒီယို Recap Script ဖန်တီးနေပါသည်...";

    try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ` + apiKey,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: 'llama-3.3-70b-versatile',
                messages: [
                    { 
                        role: 'system', 
                        content: 'You are an expert movie and video recap scriptwriter. Read the provided transcript lines, extract the core storyline, and write an engaging, smooth narrative recap script in fluent Burmese language suitable for YouTube or TikTok video storytelling. Organize it neatly with headings or paragraphs.' 
                    },
                    { 
                        role: 'user', 
                        content: `ဒီ Transcript စာသားတွေကို အခြေခံပြီး စိတ်ဝင်စားစရာကောင်းတဲ့ ဗီဒီယို Recap ဇာတ်ညွှန်း (Storyline Recap Script) တစ်ခုကို မြန်မာလို ရေးပေးပါ:\n\n${transcriptText}` 
                    }
                ],
                temperature: 0.7
            })
        });

        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.error?.message || 'Script Generation Error');
        }

        scriptResult.value = data.choices[0].message.content;
        status.innerText = "✅ Recap Script ရေးသားခြင်း အောင်မြင်ပါသည်။";

    } catch (err) {
        status.innerText = "❌ Script ရေးရာတွင် အမှားတွေ့ရှိပါသည်";
        errorBox.style.display = 'block';
        errorBox.innerText = err.message;
    }
}
</script>

</body>
</html>
