<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Burmese AI Voice Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">
    <div class="max-w-2xl mx-auto space-y-6">
        <header class="mb-4">
            <h1 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                <span>🎙️</span> Free Burmese Voice Generator
            </h1>
            <p class="text-xs text-slate-400">မြန်မာစာများကို အခမဲ့ အသံဖိုင် (MP3) အဖြစ် ပြောင်းလဲရန်</p>
        </header>

        <!-- Burmese Text to Voiceover Audio Download Tool (100% Free) -->
        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-xl space-y-4">
            <h2 class="text-sm font-semibold text-amber-300 flex items-center gap-2">
                <span>🇲🇲</span> မြန်မာစာမှ အသံဖိုင် (Voiceover MP3) ထုတ်ရန်
            </h2>
            <p class="text-[11px] text-slate-400">💡 API Key လုံးဝ မလိုပါ။ လုံးဝ အခမဲ့ (Free) အသုံးပြုနိုင်ပါသည်။</p>

            <div class="space-y-2">
                <label class="block text-xs text-slate-300 font-semibold">✍️ မြန်မာစာသားများ ထည့်ရန်:</label>
                <textarea id="burmeseInput" rows="5" placeholder="အသံဖိုင်ထုတ်မည့် မြန်မာစာများကို ဤနေရာတွင် Paste လုပ်ပါ..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-slate-100 focus:outline-none leading-relaxed"></textarea>
                
                <!-- Action Buttons -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2">
                    <button id="generateAudioBtn" class="bg-purple-600 hover:bg-purple-500 text-white font-medium py-2.5 px-3 rounded-lg text-xs transition flex items-center justify-center gap-1 shadow-lg">
                        <span>🔊</span> အသံဖိုင် အခမဲ့ထုတ်မည်
                    </button>
                    <button id="downloadTextBtn" class="bg-teal-600 hover:bg-teal-500 text-white font-medium py-2.5 px-3 rounded-lg text-xs transition flex items-center justify-center gap-1 shadow-lg">
                        <span>💾</span> စာသားဖိုင်သိမ်းရန် (.txt)
                    </button>
                </div>

                <!-- Audio Player & Download Area -->
                <div id="audioPlayerArea" class="hidden pt-3 space-y-2">
                    <p class="text-xs text-emerald-400 font-medium">✨ အသံဖိုင် အဆင်သင့် ဖြစ်ပါပြီ -</p>
                    <audio id="audioResult" controls class="w-full h-10"></audio>
                    <a id="downloadAudioLink" class="block w-full text-center bg-amber-600 hover:bg-amber-500 text-white font-medium py-2 rounded-lg text-xs transition shadow-lg">
                        📥 အသံဖိုင် (MP3) ဒေါင်းလုပ်ဆွဲရန်
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Free Google Translate TTS API Integration (CORS-Safe)
        document.getElementById('generateAudioBtn').addEventListener('click', () => {
            const text = document.getElementById('burmeseInput').value.trim();
            const audioPlayerArea = document.getElementById('audioPlayerArea');
            const audioResult = document.getElementById('audioResult');
            const downloadAudioLink = document.getElementById('downloadAudioLink');

            if (!text) {
                alert('အသံဖိုင်ထုတ်ရန် စာသား ထည့်သွင်းပေးပါ။');
                return;
            }

            // Google Translate TTS Public Endpoint (Free & No Key Required)
            // Maximum text length per request is around 200 characters. For longer text, it splits or uses browser speech.
            if (text.length > 200) {
                alert('စာသားအရှည်လွန်းပါသည်။ စာကြောင်းရေအနည်းငယ်စီ ခွဲ၍ (သို့မဟုတ်) အောက်ပါ Browser Speech ကို သုံးပေးပါ။');
            }

            const encodedText = encodeURIComponent(text);
            const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=my&client=tw-ob`;

            audioResult.src = ttsUrl;
            downloadAudioLink.href = ttsUrl;
            downloadAudioLink.download = 'burmese_voice.mp3';

            audioPlayerArea.classList.remove('hidden');
            alert('အသံဖိုင် အောင်မြင်စွာ ထွက်လာပါပြီ!');
        });

        // Text Download
        document.getElementById('downloadTextBtn').addEventListener('click', () => {
            const textContent = document.getElementById('burmeseInput').value.trim();
            if (!textContent) {
                alert('ဒေါင်းလုပ်ဆွဲရန် စာသား မရှိသေးပါ။');
                return;
            }

            let element = document.createElement('a');
            let file = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            element.href = URL.createObjectURL(file);
            element.download = 'burmese_script.txt';
            element.click();
        });
    </script>
</body>
</html>
