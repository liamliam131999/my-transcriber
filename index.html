<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcriber with Timestamps</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 650px; margin: 30px auto; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button, textarea { width: 100%; margin-top: 10px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #45a049; }
        #status { margin-top: 10px; font-weight: bold; color: #333; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎙️ Transcriber (with Timestamps)</h2>
    <label>Groq API Key:</label>
    <input type="password" id="apiKey" placeholder="gsk_...">
    
    <label style="margin-top:15px; display:block;">Video/Audio File တင်ပါ (Max 25MB):</label>
    <input type="file" id="fileInput" accept="audio/*,video/*">
    
    <button onclick="transcribe()">Timestamp ပါ စာသားထုတ်ရန်</button>
    
    <div id="status"></div>
    
    <label style="margin-top:15px; display:block;">စက္ကန့် အတိအကျ ရလဒ်:</label>
    <textarea id="result" rows="12" readonly></textarea>
</div>

<script>
function formatTime(seconds) {
    const pad = (num) => String(num).padStart(2, '0');
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);
    return hrs > 0 ? `${pad(hrs)}:${pad(mins)}:${pad(secs)}` : `${pad(mins)}:${pad(secs)}`;
}

async function transcribe() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const result = document.getElementById('result');

    if (!apiKey) { alert('Groq API Key ထည့်ပေးပါ'); return; }
    if (!fileInput.files[0]) { alert('File တစ်ခုခု ရွေးပေးပါ'); return; }

    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append('file', file);
    formData.append('model', 'whisper-large-v3');
    formData.append('response_format', 'verbose_json');

    status.innerText = "⏳ Timestamps စာသားများ ထုတ်ယူနေပါသည်... ခဏစောင့်ပါ...";
    result.value = "";

    try {
        const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${apiKey}` },
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error ? data.error.message : 'API Error ဖြစ်ပွားပါသည်');
        }

        status.innerText = "✅ အောင်မြင်စွာ ပြီးဆုံးပါပြီ!";
        
        if (data.segments) {
            let output = "";
            data.segments.forEach(seg => {
                const start = formatTime(seg.start);
                const end = formatTime(seg.end);
                output += `[${start} - ${end}] ${seg.text.trim()}\n`;
            });
            result.value = output;
        } else {
            result.value = data.text;
        }

    } catch (err) {
        status.innerText = "❌ အမှားအယွင်း: " + err.message;
    }
}
</script>

</body>
</html>
