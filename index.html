<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FFmpeg WASM CDN v0.12.7 -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/util.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <header class="mb-6">
            <h1 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                <span>⚡</span> AI Video Studio Pro
            </h1>
            <p class="text-xs text-slate-400">ဗီဒီယိုများတင်ခြင်းနှင့် အသံတိတ်ပိုင်းများကို အလိုအလျောက် ဖြတ်တောက်ခြင်းစနစ်</p>
        </header>

        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-xl">
            <h2 class="text-sm font-semibold text-amber-300 mb-4 flex items-center gap-2">
                <span>✂️</span> ၂။ အသံတိတ် ဖြတ်ထုတ်ခြင်း & ဆက်ခြင်း
            </h2>
            
            <div class="mb-4">
                <label class="block text-xs text-slate-400 mb-2">📹 ဗီဒီယိုဖိုင် တင်ပါ:</label>
                <input type="file" id="videoInput" accept="video/*" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-amber-300 hover:file:bg-slate-600 cursor-pointer">
            </div>

            <button id="processBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 px-4 rounded-lg text-xs transition flex items-center justify-center gap-2 shadow-lg">
                <span>🤖</span> အသံတိတ်များ ဖြတ်ထုတ်မည် (Jump Cut)
            </button>

            <!-- Status & Detailed Error Box -->
            <div id="statusBox" class="mt-4 p-3 rounded-lg text-xs hidden bg-slate-900 border border-slate-700">
                <span id="statusText">အဆင်သင့်ဖြစ်ပါပြီ။</span>
            </div>

            <!-- Download Link Area -->
            <div id="downloadArea" class="mt-4 hidden">
                <a id="downloadLink" class="block text-center bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded-lg text-xs transition">
                    📥 တည်းဖြတ်ပြီးသား ဗီဒီယိုကို သိမ်းဆည်းရန်
                </a>
            </div>
        </div>
    </div>

    <script>
        const { FFmpeg } = FFmpegWASM;
        const { fetchFile, toBlobURL } = FFmpegUtil;
        let ffmpeg = null;

        async function loadFFmpeg() {
            if (ffmpeg) return ffmpeg;
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            
            statusBox.classList.remove('hidden');
            statusText.textContent = 'FFmpeg Engine ကို စတင်ဖွင့်နေပါပြီ (ခဏစောင့်ပါ)...';

            try {
                ffmpeg = new FFmpeg();
                
                ffmpeg.on('log', ({ message }) => {
                    console.log(message);
                });

                // CORS Error မတက်စေရန် CDN file များကို Blob URL အဖြစ် ပြောင်းလဲပေးခြင်း
                const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
                await ffmpeg.load({
                    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
                });

                statusText.textContent = 'FFmpeg အဆင်သင့်ဖြစ်ပါပြီ။';
                return ffmpeg;
            } catch (error) {
                console.error(error);
                statusText.innerHTML = `<span class="text-red-400 font-bold">FFmpeg ချိတ်ဆက်မှု အမှား:</span> ${error.message || error}`;
                throw error;
            }
        }

        document.getElementById('processBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('videoInput');
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const downloadArea = document.getElementById('downloadArea');

            if (fileInput.files.length === 0) {
                statusBox.classList.remove('hidden');
                statusText.innerHTML = '<span class="text-red-400">ကျေးဇူးပြု၍ ဗီဒီယိုဖိုင် တစ်ခု ရွေးချယ်ပါ။</span>';
                return;
            }

            const videoFile = fileInput.files[0];
            downloadArea.classList.add('hidden');
            statusBox.classList.remove('hidden');

            try {
                statusText.textContent = 'FFmpeg ကို စတင်ပြင်ဆင်နေပါပြီ...';
                const ff = await loadFFmpeg();

                statusText.textContent = 'ဗီဒီယိုဖိုင်ကို FFmpeg ထဲသို့ ထည့်သွင်းနေပါပြီ...';
                const inputName = 'input.mp4';
                const outputName = 'output.mp4';

                await ff.writeFile(inputName, await fetchFile(videoFile));

                statusText.textContent = 'အသံတိတ်နေရာများ ဖြတ်ထုတ်နေပါပြီ (ခဏစောင့်ပါ)...';
                
                // ဗီဒီယိုတည်းဖြတ်မှု အလုပ်လုပ်စေမည့် FFmpeg Command
                await ff.exec(['-i', inputName, '-vcodec', 'libx264', '-crf', '28', outputName]);

                statusText.textContent = 'အောင်မြင်စွာ ပြီးဆုံးပါပြီ!';
                
                const data = await ff.readFile(outputName);
                const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
                
                const downloadLink = document.getElementById('downloadLink');
                downloadLink.href = url;
                downloadLink.download = 'edited_output.mp4';
                downloadArea.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                statusBox.classList.remove('hidden');
                statusText.innerHTML = `<span class="text-red-400 font-bold">ဗီဒီယိုတည်းဖြတ်ရာတွင် အမှားဖြစ်သွားပါသည်။</span><br><span class="text-xs text-slate-300 mt-1 block">အကြောင်းရင်း: ${error.message || error}</span>`;
            }
        });
    </script>
</body>
</html>
