<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq Audio Transcriber & Voice Reader</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">

    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            max-width: 680px; 
            margin: 20px auto; 
            padding: 15px; 
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%); 
            min-height: 100vh;
            color: #2c3e50; 
        }
        .card { 
            background: #ffffff; 
            padding: 28px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.12); 
        }
        h2 { 
            margin-top: 0; 
            color: #1a73e8; 
            font-size: 22px; 
            text-align: center;
            border-bottom: 2px dashed #e0e0e0;
            padding-bottom: 12px;
        }
        label { 
            font-weight: 600; 
            margin-top: 18px; 
            display: block; 
            font-size: 15px; 
        }
        input, select, button, textarea { 
            width: 100%; 
            margin-top: 8px; 
            padding: 12px 14px; 
            border-radius: 10px; 
            border: 1px solid #cbd5e1; 
            box-sizing: border-box; 
            font-size: 14px; 
            transition: all 0.2s ease;
        }
        input:focus, select:focus { 
            border-color: #1a73e8; 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(26,115,232,0.2);
        }
        .key-row {
            display: flex;
            gap: 10px;
        }
        .save-key-btn {
            margin-top: 8px;
            width: 120px;
            background: #059669;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 10px;
        }
        .save-key-btn:hover { background: #047857; }
        
        button.main-btn { 
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); 
            color: white; 
            border: none; 
            font-weight: bold; 
            font-size: 16px;
            cursor: pointer; 
            margin-top: 22px; 
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(37,99,235,0.3);
            padding: 14px;
        }
        button.main-btn:hover { transform: translateY(-1px); }

        button.voice-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 10px;
            padding: 12px;
        }
        button.voice-btn:hover { background: #047857; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }

        #status { margin-top: 15px; font-weight: bold; font-size: 14px; color: #334155; }
        .error-box { 
            background: #fef2f2; 
            border: 1px solid #fecaca;
            border-left: 5px solid #ef4444; 
            padding: 14px; 
            border-radius: 10px; 
            color: #991b1b; 
            margin-top: 15px; 
            display: none; 
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🎙️ Groq Audio Transcriber & Voice 🇲🇲</h2>
    
    <label>🔑 Groq API Key:</label>
    <div class="key-row">
        <input type="password" id="apiKey" placeholder="gsk_..." autocomplete="off">
        <button type="button" class="save-key-btn" onclick="saveApiKeyManually()">💾 Save</button>
    </div>

    <label>🧩 Part ရွေးပါ:</label>
    <select id="partSelect">
        <option value="0">▶️ Part 1 (00:00:00 မှ စမည်)</option>
        <option value="1200">⏩ Part 2 (00:20:00 မှ စမည်)</option>
        <option value="2400">⏩ Part 3 (00:40:00 မှ စမည်)</option>
        <option value="3600">⏩ Part 4 (01:00:00 မှ စမည်)</option>
    </select>

    <label>🗣️ မူရင်း အသံဖိုင် ဘာသာစကား:</label>
    <select id="langSelect">
        <option value="zh">🇨🇳 တရုတ်ဘာသာ (Chinese)</option>
        <option value="en">🇬🇧 အင်္ဂလိပ်ဘာသာ (English)</option>
        <option value="auto">🌐 အလိုအလျောက် (Auto Detect)</option>
    </select>

    <label>📁 Audio File တင်ပါ:</label>
    <input type="file" id="fileInput" accept="audio/*,video/*">
    
    <button id="transcribeBtn" class="main-btn" onclick="transcribe()">🚀 မြန်မာလို တိုက်ရိုက် ဘာသာပြန်မည်</button>
    
    <div id="status"></div>
    <div id="errorBox" class="error-box"></div>
    
    <label style="margin-top:22px;">📝 မြန်မာဘာသာပြန် ရလဒ်:</label>
    <textarea id="result" rows="10" readonly placeholder="✨ ဘာသာပြန်စာသားများ ဤနေရာတွင် ပေါ်လာပါမည်..."></textarea>

    <button id="speakBtn" class="voice-btn" onclick="speakText()" disabled>🔊 ရလဒ်များကို အသံထွက်ဖတ်ခိုင်းမည် (Speech)</button>
    <button id="stopBtn" class="voice-btn" style="background: #dc2626; display:none;" onclick="stopSpeech()">⏹️ အသံထွက်ခြင်း ရပ်တန့်မည်</button>
</div>

<script>
window.onload = function() {
    const savedKey = localStorage.getItem('groq_api_key');
    if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
    }
};

function saveApiKeyManually() {
    const key = document.getElementById('apiKey').value.trim();
    if (key) {
        localStorage.setItem('groq_api_key', key);
        alert('✅ API Key သိမ်းဆည်းပြီးပါပြီ!');
    }
}

function formatTime(seconds) {
    const pad = (num) => String(num).padStart(2, '0');
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);
    return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
}

async function transcribe() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const fileInput = document.getElementById('fileInput');
    const offsetSeconds = parseInt(document.getElementById('partSelect').value);
    const selectedLang = document.getElementById('langSelect').value;
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const errorBox = document.getElementById('errorBox');
    const speakBtn = document.getElementById('speakBtn');

    errorBox.style.display = 'none';
    if (!apiKey) { alert('⚠️ API Key ထည့်ပါ'); return; }
    if (!fileInput.files[0]) { alert('⚠️ Audio ဖိုင် ရွေးပေးပါ'); return; }

    localStorage.setItem('groq_api_key', apiKey);
    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append('file', file);
    formData.append('model', 'whisper-large-v3');
    formData.append('response_format', 'verbose_json');
    if (selectedLang !== 'auto') formData.append('language', selectedLang);

    status.innerText = "⏳ ၁။ အသံဖိုင်မှ စာသားထုတ်ယူနေပါသည်...";
    result.value = "";
    speakBtn.disabled = true;

    try {
        const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ` + apiKey },
            body: formData
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || 'API Error');

        status.innerText = "⏳ ၂။ မြန်မာဘာသာသို့ ဘာသာပြန်နေပါသည်...";
        let originalTexts = data.segments.map((seg, idx) => `[${idx}] ${seg.text.trim()}`).join('\n');

        const translateResponse = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ` + apiKey,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: 'llama-3.1-8b-instant',
                messages: [
                    { role: 'system', content: 'Translate the following indexed text lines into fluent Burmese. Keep the exact format `[index] text`.' },
                    { role: 'user', content: originalTexts }
                ],
                temperature: 0.3
            })
        });

        const translateData = await translateResponse.json();
        if (!translateResponse.ok) throw new Error('Translation failed');

        const translatedTextContent = translateData.choices[0].message.content;
        const translatedMap = {};
        translatedTextContent.split('\n').forEach(line => {
            const match = line.match(/\[(\d+)\]\s*(.*)/);
            if (match) translatedMap[match[1]] = match[2];
        });

        status.innerText = "✅ အောင်မြင်စွာ ဘာသာပြန်ပြီးပါပြီ!";
        let output = "";
        data.segments.forEach((seg, idx) => {
            const start = formatTime(seg.start + offsetSeconds);
            const end = formatTime(seg.end + offsetSeconds);
            const text = translatedMap[idx] || seg.text.trim();
            output += `[${start} - ${end}] ${text}\n`;
        });
        
        result.value = output;
        speakBtn.disabled = false;

    } catch (err) {
        status.innerText = "❌ အမှား: " + err.message;
    }
}

function speakText() {
    const resultText = document.getElementById('result').value;
    if (!resultText) return;
    const cleanText = resultText.replace(/\[\d{2}:\d{2}:\d{2}\s*-\s*\d{2}:\d{2}:\d{2}\]/g, '');

    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'my-MM';
        utterance.rate = 1.0;

        utterance.onstart = function() {
            document.getElementById('speakBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
            document.getElementById('status').innerText = "🔊 အသံထွက်ဖတ်ပြနေပါပြီ...";
        };

        utterance.onend = function() {
            document.getElementById('speakBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('status').innerText = "✅ အသံထွက်ဖတ်ပြခြင်း ပြီးဆုံးပါပြီ။";
        };

        window.speechSynthesis.speak(utterance);
    } else {
        alert('⚠️ သင့် Browser သည် အသံထွက်ဖတ်ခြင်းကို မထောက်ပံ့ပါ။');
    }
}

function stopSpeech() {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        document.getElementById('speakBtn').style.display = 'block';
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('status').innerText = "⏹️ အသံထွက်ခြင်းကို ရပ်တန့်လိုက်ပါပြီ။";
    }
}
</script>
</body>
</html>
