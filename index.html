<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Video Silence Remover & Transcriber 🇲🇲</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">

    <!-- FFmpeg.wasm for Browser-side Video Editing -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>

    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            max-width: 680px; 
            margin: 20px auto; 
            padding: 15px; 
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%); 
            min-height: 100vh;
            color: #2c3e50; 
        }
        .card { 
            background: #ffffff; 
            padding: 28px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.12); 
        }
        h2 { 
            margin-top: 0; 
            color: #1a73e8; 
            font-size: 22px; 
            text-align: center;
            border-bottom: 2px dashed #e0e0e0;
            padding-bottom: 12px;
        }
        label { 
            font-weight: 600; 
            margin-top: 18px; 
            display: block; 
            font-size: 15px; 
        }
        input, select, button, textarea { 
            width: 100%; 
            margin-top: 8px; 
            padding: 12px 14px; 
            border-radius: 10px; 
            border: 1px solid #cbd5e1; 
            box-sizing: border-box; 
            font-size: 14px; 
            transition: all 0.2s ease;
        }
        input:focus, select:focus { 
            border-color: #1a73e8; 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(26,115,232,0.2);
        }
        .key-row { display: flex; gap: 10px; }
        .save-key-btn {
            margin-top: 8px; width: 120px; background: #059669; color: white;
            border: none; font-weight: bold; cursor: pointer; border-radius: 10px;
        }
        .save-key-btn:hover { background: #047857; }
        
        button.main-btn { 
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); 
            color: white; border: none; font-weight: bold; font-size: 16px;
            cursor: pointer; margin-top: 22px; border-radius: 10px;
            box-shadow: 0 4px 12px rgba(37,99,235,0.3); padding: 14px;
        }
        button.main-btn:hover { transform: translateY(-1px); }

        button.cut-btn {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white; border: none; font-weight: bold; font-size: 16px;
            cursor: pointer; margin-top: 12px; border-radius: 10px;
            box-shadow: 0 4px 12px rgba(5,150,105,0.3); padding: 14px;
        }
        button.cut-btn:hover { background: #065f46; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }

        #status, #editStatus { margin-top: 12px; font-weight: bold; font-size: 14px; color: #334155; }
        
        .error-box { 
            background: #fef2f2; border: 1px solid #fecaca; border-left: 5px solid #ef4444; 
            padding: 14px; border-radius: 10px; color: #991b1b; margin-top: 15px; display: none; word-break: break-all;
        }
        video {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
            background: #000;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🎬 Auto Video Silence Remover & Transcriber 🇲🇲</h2>
    
    <label>🔑 သုံးမည့် API Key ကို ရွေးပါ:</label>
    <select id="activeKeySelect" onchange="onKeySelectionChange()">
        <option value="key1">🔑 API Key (၁)</option>
        <option value="key2">🔑 API Key (၂)</option>
        <option value="key3">🔑 API Key (၃)</option>
    </select>

    <label id="keyInputLabel">🔑 API Key (၁) ထည့်ရန်:</label>
    <div class="key-row">
        <input type="password" id="apiKeyInput" placeholder="gsk_..." autocomplete="off">
        <button type="button" class="save-key-btn" onclick="saveActiveApiKey()">💾 Save</button>
    </div>

    <label>📁 ဗီဒီယို (သို့) အသံဖိုင် တင်ပါ:</label>
    <input type="file" id="fileInput" accept="video/*,audio/*">
    
    <button id="transcribeBtn" class="main-btn" onclick="transcribe()">🚀 ဇာတ်ကောင်စပြောမည့်အချိန် ညှိပြီး စာထုတ်မည်</button>
    
    <div id="status"></div>
    <div id="errorBox" class="error-box"></div>
    
    <label style="margin-top:22px;">📝 ထွက်လာသည့် စာသားရလဒ် (Transcript):</label>
    <textarea id="result" rows="6" readonly placeholder="✨ စာများ ဤနေရာတွင် ပေါ်လာပါမည်..."></textarea>

    <!-- Auto Silence Removal / Video Editor Section -->
    <hr style="margin: 25px 0; border: 0; border-top: 1px solid #cbd5e1;">
    <h3 style="color: #059669; font-size: 18px; margin-bottom: 5px;">✂️ Auto Silence Remover (အသံတိတ်အပိုင်းများ အလိုအလျောက် ဖြတ်ထုတ်ရန်)</h3>
    <p style="font-size: 13px; color: #64748b; margin-top: 0;">ဗီဒီယိုထဲမှ စကားမပြောဘဲ တိတ်ဆိတ်နေသော နေရာများကို ဖယ်ရှားပြီး ဇာတ်ကောင်စကားပြောသည့် အပိုင်းများကိုသာ အလိုအလျောက် ဆက်ပေးပါမည်။</p>

    <button id="autoCutBtn" class="cut-btn" onclick="autoRemoveSilence()" disabled>✂️ အသံတိတ်အပိုင်းများ ဖြတ်ထုတ်ပြီး ဗီဒီယိုအချောထည် ထုတ်မည်</button>
    <div id="editStatus"></div>

    <label style="margin-top:15px;">▶️ တည်းဖြတ်ပြီး ဗီဒီယိုအချောထည် (Preview & Download):</label>
    <video id="outputVideo" controls style="display:none;"></video>
    <a id="downloadLink" style="display:none; margin-top: 12px;" download="edited_final_video.mp4">
        <button class="main-btn" style="background: #0d9488; margin-top: 5px;">📥 ဗီဒီယိုကို ဖုန်းထဲသို့ Save / Download လုပ်ရန်</button>
    </a>
</div>

<script>
const { createFFmpeg, fetchFile } = FFmpeg;
let ffmpeg = null;

window.onload = function() {
    loadKeyForSelection();
};

function getSelectedKeyName() {
    return document.getElementById('activeKeySelect').value;
}

function onKeySelectionChange() {
    const selected = getSelectedKeyName();
    const selectElem = document.getElementById('activeKeySelect');
    const labelElem = document.getElementById('keyInputLabel');
    labelElem.innerText = `🔑 ${selectElem.options[selectElem.selectedIndex].text} ထည့်ရန်:`;
    loadKeyForSelection();
}

function loadKeyForSelection() {
    const keyName = getSelectedKeyName();
    const savedKey = localStorage.getItem('groq_' + keyName) || '';
    document.getElementById('apiKeyInput').value = savedKey;
}

function saveActiveApiKey() {
    const keyName = getSelectedKeyName();
    const keyValue = document.getElementById('apiKeyInput').value.trim();
    if (keyValue) {
        localStorage.setItem('groq_' + keyName, keyValue);
        alert(`✅ ${document.getElementById('activeKeySelect').selectedOptions[0].text} ကို သိမ်းဆည်းပြီးပါပြီ!`);
    } else {
        localStorage.removeItem('groq_' + keyName);
        alert(`🗑️ Key ကို ဖျက်လိုက်ပါပြီ။`);
    }
}

function formatTime(seconds) {
    const pad = (num) => String(num).padStart(2, '0');
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);
    return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
}

let activeSegments = []; // သိမ်းဆည်းထားမည့် ဇာတ်ကောင်စပြောသော အပိုင်းများ

async function transcribe() {
    const keyName = getSelectedKeyName();
    const apiKey = localStorage.getItem('groq_' + keyName) || document.getElementById('apiKeyInput').value.trim();
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const errorBox = document.getElementById('errorBox');
    const autoCutBtn = document.getElementById('autoCutBtn');

    errorBox.style.display = 'none';

    if (!apiKey) { alert('⚠️ ကျေးဇူးပြု၍ API Key ထည့်ပါ'); return; }
    if (!fileInput.files[0]) { alert('⚠️ ဗီဒီယို သို့မဟုတ် အသံဖိုင် ရွေးပေးပါ'); return; }

    localStorage.setItem('groq_' + keyName, apiKey);
    const file = fileInput.files[0];
    
    const formData = new FormData();
    formData.append('file', file);
    formData.append('model', 'whisper-large-v3');
    formData.append('response_format', 'verbose_json');

    status.innerText = "⏳ ဖိုင်မှ အချက်အလက်များ ထုတ်ယူနေပါသည်...";
    result.value = "";
    autoCutBtn.disabled = true;

    try {
        const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ` + apiKey },
            body: formData
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || 'API Error');

        status.innerText = "✅ စာသားထုတ်ယူခြင်း ပြီးစီးပါပြီ။";
        let output = "";
        activeSegments = [];

        let validSegments = data.segments.filter(seg => seg.text && seg.text.trim().length > 0);

        validSegments.forEach((seg) => {
            activeSegments.push({ start: seg.start, end: seg.end });
            output += `[${formatTime(seg.start)} - ${formatTime(seg.end)}] ${seg.text.trim()}\n`;
        });
        
        result.value = output;
        if (activeSegments.length > 0 && file.type.startsWith('video')) {
            autoCutBtn.disabled = false;
        }

    } catch (err) {
        status.innerText = "❌ အမှားတွေ့ရှိပါသည်";
        errorBox.style.display = 'block';
        errorBox.innerText = err.message;
    }
}

// FFmpeg ဖြင့် အသံတိတ်အပိုင်းများ ဖယ်ရှားပြီး ဗီဒီယိုအချောထည်ထုတ်ခြင်း
async function autoRemoveSilence() {
    const fileInput = document.getElementById('fileInput');
    const editStatus = document.getElementById('editStatus');
    const outputVideo = document.getElementById('outputVideo');
    const downloadLink = document.getElementById('downloadLink');

    if (!fileInput.files[0] || activeSegments.length === 0) {
        alert('⚠️ ဖြတ်ထုတ်ရန် အချက်အလက် မလုံလောက်ပါ။');
        return;
    }

    if (!ffmpeg) {
        editStatus.innerText = "⏳ ဗီဒီယိုတည်းဖြတ်စနစ်ကို စတင်ဒေါင်းလုပ်လုပ်နေပါသည် (ခဏစောင့်ပါ)...";
        try {
            ffmpeg = createFFmpeg({ log: true });
            await ffmpeg.load();
        } catch (e) {
            editStatus.innerText = "❌ FFmpeg စတင်၍မရပါ။";
            return;
        }
    }

    editStatus.innerText = "⏳ ဗီဒီယိုကို အသံတိတ်နေရာများ ဖယ်ရှားကာ တည်းဖြတ်နေပါပြီ...";
    const file = fileInput.files[0];
    const inputName = 'input.mp4';
    
    ffmpeg.FS('writeFile', inputName, await fetchFile(file));

    // FFmpeg filter complex တည်ဆောက်ခြင်း (ဇာတ်ကောင်စပြောသော အပိုင်းများကိုသာ ညှပ်ဆက်ရန်)
    let filterParts = [];
    let concatInputs = [];
    
    activeSegments.forEach((seg, index) => {
        // အချိန်အကွာအဝေး အနည်းဆုံး 0.3 စက္ကန့်ရှိမှသာ ယူမည်
        if (seg.end - seg.start > 0.2) {
            filterParts.push(`[0:v]trim=start=${seg.start}:end=${seg.end},setpts=PTS-STARTPTS[v${index}];[0:a]atrim=start=${seg.start}:end=${seg.end},asetpts=PTS-STARTPTS[a${index}]`);
            concatInputs.push(`[v${index}][a${index}]`);
        }
    });

    if (concatInputs.length === 0) {
        editStatus.innerText = "❌ ညှပ်ထုတ်ရန် အပိုင်းအစ မတွေ့ပါ။";
        return;
    }

    let filterScript = filterParts.join(';') + `;${concatInputs.join('')}concat=n=${concatInputs.length}:v=1:a=1[outv][outa]`;

    try {
        await ffmpeg.run(
            '-i', inputName,
            '-filter_complex', filterScript,
            '-map', '[outv]',
            '-map', '[outa]',
            'output.mp4'
        );

        editStatus.innerText = "✅ ဗီဒီယို တည်းဖြတ်ခြင်း အောင်မြင်ပါသည်။ Save ပြုလုပ်နိုင်ပါပြီ!";
        const data = ffmpeg.FS('readFile', 'output.mp4');
        
        const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
        const videoUrl = URL.createObjectURL(videoBlob);
        
        outputVideo.src = videoUrl;
        outputVideo.style.display = 'block';
        downloadLink.href = videoUrl;
        downloadLink.style.display = 'block';

    } catch (err) {
        editStatus.innerText = "❌ ဗီဒီယိုတည်းဖြတ်ရာတွင် အမှားဖြစ်သွားပါသည်။";
        console.error(err);
    }
}
</script>

</body>
</html>
